  var todayChecked=!!checkins[G.today];
  var thisWeekDone=weekDates.filter(function(d){return!!checkins[d];}).length;
  var weekPct=Math.min(Math.round(thisWeekDone/diasPorSemana*100),100);

  var dayPills=weekDates.map(function(date,i){
    var isToday=date===G.today;
    var isDone=!!checkins[date];
    var cls="meta-day-pill"+(isDone?" done":isToday?" today":"");
    return '<div class="'+cls+'"><span>'+DAY_NAMES[i]+'</span><span class="meta-day-check">'+(isDone?"✓":isToday?"●":"·")+'</span></div>';
  }).join("");

  // type params
  var paramsLine="";
  if(act.typeParams){var p=act.typeParams;
    if(p.logro)paramsLine+='<span style="margin-right:8px">🎯 '+esc(p.logro)+'</span>';
    if(p.monto)paramsLine+='<span style="margin-right:8px">💵 '+esc(p.monto)+'</span>';
    if(p.duracion)paramsLine+='<span style="margin-right:8px">⏱ '+esc(p.duracion)+'</span>';
    if(p.practica)paramsLine+='<span style="margin-right:8px">⏱ '+esc(p.practica)+'</span>';
  }

  // today's micro-task
  var dailyTask=getMetaDailyTask(act);
  var notifGranted=("Notification" in window)&&Notification.permission==="granted";

  // step list — no manual checkbox, earned by consecutive streak
  var stepList=act.weeks.map(function(w,i){
    var lbl=_metaStepLabel(act,i);
    var isCur=i===curStepIdx&&!w.done;
    var isLocked=!w.done&&!isCur;
    var icon=w.done
      ?'<span style="color:var(--green);font-size:13px;font-weight:700">✓</span>'
      :isCur
        ?'<span style="color:var(--acc);font-size:13px">→</span>'
        :'<span style="font-size:12px;opacity:.35">🔒</span>';
    var statusLine=w.done
      ?('<span style="color:var(--green)">'+esc(w.completedDate||"Completado")+'</span>')
      :isCur
        ?(streakBroken
          ?'<span style="color:var(--danger)">Racha rota — empieza de nuevo</span>'
          :'<span style="color:var(--acc)">'+curStreak+' / '+stepReq+' días seguidos</span>')
        :'<span style="color:var(--txt3)">'+stepReq+' días seguidos para desbloquear</span>';
    return '<div class="meta-week-item'+(w.done?" done":isCur?" cur":"")+'" style="opacity:'+(isLocked?.35:1)+'">'+
      '<div style="min-width:22px;text-align:center;padding-top:1px">'+icon+'</div>'+
      '<div class="meta-week-body">'+
        '<div class="meta-week-num">'+esc(lbl)+' · '+statusLine+'</div>'+
        '<div class="meta-week-task" style="'+(isLocked?"color:var(--txt3)":"")+'">'+esc(w.task)+'</div>'+
        (isCur&&!streakBroken&&curStreak>0
          ?'<div class="meta-prog-bar" style="margin-top:5px"><div class="meta-prog-fill" style="width:'+Math.min(Math.round(curStreak/stepReq*100),100)+'%"></div></div>'
          :'')+
      '</div></div>';
  }).join("");

  return (
    /* Header */
    '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:2px">'+
      '<div style="font-size:13px;font-weight:600">'+tobj.icon+' '+esc(act.title)+'</div>'+
      '<span class="meta-nivel-badge" style="color:'+niv.color+'">'+niv.label+'</span>'+
    '</div>'+
    '<div style="font-size:10px;color:var(--txt2);margin-bottom:8px">'+dur.v+' '+esc(dur.u)+' · '+diasPorSemana+' días/sem'+(paramsLine?' · '+paramsLine:'')+'</div>'+
    /* Overall progress */
    '<div class="meta-progress" style="margin-bottom:10px">'+
      '<div style="display:flex;justify-content:space-between;font-size:10px;color:var(--txt2)">'+
        '<span>Paso '+(allDone?totalSteps:curStepIdx+1)+' / '+totalSteps+(allDone?' — Completados':'')+'</span><span>'+overallPct+'%</span>'+
      '</div>'+
      '<div class="meta-prog-bar"><div class="meta-prog-fill" style="width:'+overallPct+'%"></div></div>'+
    '</div>'+
    /* Today card */
    '<div class="meta-today-card">'+
      (streakBroken?
        '<div style="background:rgba(239,68,68,.12);border:1px solid var(--danger);border-radius:2px;padding:6px 8px;margin-bottom:8px;font-size:10px;color:var(--danger);font-family:\'Oswald\',sans-serif;font-weight:700;letter-spacing:.06em">'+
          '⚠ RACHA ROTA — Vuelves a 0 en este paso. Hoy empieza de nuevo.'+
        '</div>':'')+
      '<div class="meta-today-label">Tu tarea de hoy</div>'+
      '<div class="meta-today-task">'+esc(dailyTask)+'</div>'+
      (!allDone?
        '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">'+
          '<span style="font-size:10px;color:var(--txt2)">Días seguidos</span>'+
          '<span style="font-family:\'Oswald\',sans-serif;font-size:16px;font-weight:700;color:'+(curStreak>=stepReq?'var(--green)':curStreak>0?'var(--acc)':'var(--txt2)')+'">'+
            curStreak+' / '+stepReq+
          '</span>'+
        '</div>'+
        '<div class="meta-prog-bar" style="margin-bottom:8px"><div class="meta-prog-fill" style="width:'+Math.min(Math.round(curStreak/stepReq*100),100)+'%"></div></div>':'')+
      '<button class="meta-checkin-btn"'+(todayChecked||allDone?' disabled':'')+' onclick="checkInToday()">'+
        (todayChecked?'✓ Ya registraste hoy — sigue mañana':allDone?'✓ Todos los pasos completados':'Lo hice hoy →')+
      '</button>'+
    '</div>'+
    /* Week calendar */
    '<div style="margin-bottom:4px;display:flex;align-items:center;justify-content:space-between">'+
      '<span class="section-lbl">Esta semana</span>'+
      '<span style="font-size:10px;color:var(--txt2)">'+thisWeekDone+' / '+diasPorSemana+' días</span>'+
    '</div>'+
    '<div class="meta-day-row" style="margin-bottom:4px">'+dayPills+'</div>'+
    '<div class="meta-prog-bar" style="margin-bottom:12px"><div class="meta-prog-fill" style="width:'+weekPct+'%;background:var(--green)"></div></div>'+
    /* Notification btn */
    '<button class="meta-notif-btn'+(notifGranted?" on":"")+'" onclick="requestMetaNotif()" id="meta-notif-btn">'+
      (notifGranted?"🔔 Recordatorio activado":"🔔 Activar recordatorio diario")+
    '</button>'+
    /* Step list */
    '<div style="margin:12px 0 6px"><div class="section-lbl">Mis pasos</div></div>'+
    '<div class="meta-week-list">'+stepList+'</div>'+
    (allDone?
      '<div style="border-top:1px solid var(--border);margin-top:8px;padding-top:12px">'+
      '<div style="font-size:10px;color:var(--txt2);text-align:center;margin-bottom:8px;font-style:italic">'+
        'Lograste esto porque apareciste cada día cuando no tenías ganas.<br>Eso es lo que hace la gente inamovible.'+
      '</div>'+
      '<button class="meta-complete-btn" onclick="completeMeta()">MISIÓN CUMPLIDA — DEFINIR LA SIGUIENTE</button>'+
      '</div>':'')
  );
}

function selMetaTipo(key){
  _metaSelType=key;
  var el=document.getElementById("meta-inner");if(el)el.innerHTML=buildMetaHtml();
}
function selMetaNivel(key){
  _metaSelNivel=key;
  document.querySelectorAll(".meta-nivel-btn").forEach(function(b,i){
    var n=META_NIVELES[i];if(!n)return;
    b.classList.toggle("sel",n.key===key);b.style.borderColor=n.key===key?n.color:"";
  });
}
function selMetaDias(val){
  _metaDias=val;
  document.querySelectorAll(".meta-dias-btn").forEach(function(b){
    var d=parseInt(b.getAttribute("onclick").match(/\d+/)[0]);
    b.classList.toggle("sel",d===val);
    b.style.borderColor=d===val?"var(--acc)":"var(--border)";
    b.style.color=d===val?"var(--txt)":"var(--txt2)";
    b.style.background=d===val?"var(--acc-d)":"var(--surf)";
  });
}
async function startMeta(){
  if(!_metaSelType){showToast("Elige un tipo","Selecciona el tipo de meta primero.","warn");return;}
  if(!_metaSelNivel){showToast("Elige nivel","Selecciona la dificultad.","warn");return;}
  var titulo=((document.getElementById("meta-title-inp")||{}).value||"").trim();
  if(!titulo){showToast("Escribe tu meta","¿Cuál es tu meta?","warn");return;}
  var durV=parseInt((document.getElementById("meta-dur-val")||{}).value)||4;
  var durU=(document.getElementById("meta-dur-unit")||{}).value||"semanas";
  if(durV<1){showToast("Tiempo inválido","Pon un tiempo mayor a 0.","warn");return;}
  var tasks=[];
  for(var i=0;i<4;i++){var v=((document.getElementById("meta-task-"+i)||{}).value||"").trim();if(v)tasks.push(v);}
  if(tasks.length<2){showToast("Pasos incompletos","Define al menos 2 pasos.","warn");return;}
  while(tasks.length<4)tasks.push("Paso "+(tasks.length+1));
  var tp={};
  if(_metaSelType==="deporte"){var logro=((document.getElementById("me-logro")||{}).value||"").trim();if(logro)tp.logro=logro;}
  if(_metaSelType==="compra"){var monto=((document.getElementById("me-monto")||{}).value||"").trim();if(monto)tp.monto=monto;}
  if(_metaSelType==="habito"){var dur2=(document.getElementById("me-duracion")||{}).value||"";if(dur2)tp.duracion=dur2;}
  if(_metaSelType==="talento"){var prac=(document.getElementById("me-practica")||{}).value||"";if(prac)tp.practica=prac;}
  var hist=(G.meta&&G.meta.historial)||[];
  G.meta={historial:hist,active:{
    type:_metaSelType,nivel:_metaSelNivel,title:titulo,
    duration:{v:durV,u:durU},diasPorSemana:_metaDias,
    typeParams:tp,created:G.today,checkins:{},
    weeks:tasks.map(function(t){return{task:t,done:false};})
  }};
  _metaSelType="";_metaSelNivel="";_metaDias=3;
  await sbWrite("portal-meta-"+G.sid,G.meta);
  var el=document.getElementById("meta-inner");if(el)el.innerHTML=buildMetaHtml();
  setupMetaNotifications();
  showToast("¡Siguiente paso creado!","Cada día que hagas la tarea te acerca. Empieza hoy.","ok");
}
async function toggleMetaTask(idx,checked){
  if(!G.meta||!G.meta.active)return;
  G.meta.active.weeks[idx].done=checked;
  await sbWrite("portal-meta-"+G.sid,G.meta);
  var el=document.getElementById("meta-inner");if(el)el.innerHTML=buildMetaHtml();
}
async function completeMeta(){
  if(!G.meta||!G.meta.active)return;
  var act=G.meta.active;
  var MESES=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
  var d=new Date();
  var totalDias=Object.keys(act.checkins||{}).filter(function(k){return act.checkins[k];}).length;
  act.completedDate=d.getDate()+"/"+MESES[d.getMonth()]+"/"+d.getFullYear();
  act.totalDias=totalDias;
  var hist=G.meta.historial||[];
  hist.push(act);
  G.meta={historial:hist,active:null};
  _metaSelType="";_metaSelNivel="";_metaDias=3;
  await sbWrite("portal-meta-"+G.sid,G.meta);
  var el=document.getElementById("meta-inner");if(el)el.innerHTML=buildMetaHtml();
  showToast("Meta cumplida","Eso es lo que hace la gente que logra cosas: no para. Define la siguiente.","ok");
}

function showToast(title,msg,type,autoClose){
  var wrap=document.getElementById("notif-banner");if(!wrap)return;
  var icons={acc:'<svg style="width:16px;height:16px" viewBox="0 0 24 24" fill="none" stroke="var(--acc)" stroke-width="2.5" stroke-linecap="round"><polyline points="4,12 9,17 20,6"/></svg>',ok:'<svg style="width:16px;height:16px" viewBox="0 0 24 24" fill="none" stroke="var(--green)" stroke-width="2.5" stroke-linecap="round"><polyline points="4,12 9,17 20,6"/></svg>',warn:'<svg style="width:16px;height:16px" viewBox="0 0 24 24" fill="none" stroke="var(--warn)" stroke-width="2.5" stroke-linecap="round"><path d="M10.3 3.6L2.1 18A2 2 0 004 21h16a2 2 0 001.9-2.4L13.7 3.6a2 2 0 00-3.4 0z"/><line x1="12" y1="9" x2="12" y2="13"/></svg>',alert:'<svg style="width:16px;height:16px" viewBox="0 0 24 24" fill="none" stroke="var(--danger)" stroke-width="2.5" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><line x1="12" y1="8" x2="12" y2="12"/><circle cx="12" cy="16" r=".8" fill="var(--danger)"/></svg>'};
  var t=document.createElement("div");
  t.className="notif-toast nt-"+(type||"acc");
  t.innerHTML='<span class="notif-icon">'+(icons[type||"acc"]||icons.acc)+'</span><div class="notif-body"><div class="notif-title">'+title+'</div><div class="notif-msg">'+msg+'</div></div><button class="notif-close" onclick="this.closest(\'.notif-toast\').remove()">✕</button>';
  wrap.appendChild(t);
  if(autoClose!==false)setTimeout(function(){if(t.parentNode)t.remove();},7000);
}

function showWelcomeModal(){
  var m=document.getElementById("welcome-modal");
  if(!m)return;
  m.style.display="flex";
  setTimeout(function(){m.classList.add("visible");},20);
}
function closeWelcomeModal(){
  var m=document.getElementById("welcome-modal");
  if(!m)return;
  m.classList.remove("visible");
  setTimeout(function(){m.style.display="none";},300);
}

function showQuoteModal(q){
  var DIAS=["DOMINGO","LUNES","MARTES","MIÉRCOLES","JUEVES","VIERNES","SÁBADO"];
  var MESES=["ENE","FEB","MAR","ABR","MAY","JUN","JUL","AGO","SEP","OCT","NOV","DIC"];
  var d=new Date();
  var label=DIAS[d.getDay()]+" "+d.getDate()+" "+MESES[d.getMonth()];
  var m=document.getElementById("quote-modal");
  var qd=document.getElementById("qm-day");
  var qt=document.getElementById("qm-text");
  if(!m||!qd||!qt)return;
  qd.textContent=label;
  qt.textContent=q;
  m.style.display="flex";
  setTimeout(function(){m.classList.add("visible");},20);
}
function closeQuoteModal(ev){
  var m=document.getElementById("quote-modal");
  if(!m)return;
  if(ev&&ev.target!==m&&!ev.target.classList.contains("quote-close"))return;
  m.classList.remove("visible");
  setTimeout(function(){m.style.display="none";},300);
}

var _dayNoteDate=null;
function openDayNoteModal(dateStr){
  _dayNoteDate=dateStr;
  var m=document.getElementById("day-note-modal");
  var inp=document.getElementById("dnn-inp");
  var title=document.getElementById("dnn-title");
  if(!m)return;
  var entry=(G.calData||{})[dateStr]||{};
  var isFutureDate=dateStr>G.today;
  var tipo=isFutureDate?"PENDIENTE":"APRENDIZAJE";
  if(title)title.textContent=tipo+" — "+dateStr;
  if(inp)inp.value=entry.note||"";
  // Resaltar día seleccionado en rojo
  document.querySelectorAll(".cal-day.cal-selected").forEach(function(el){el.classList.remove("cal-selected");});
  var dayEl=document.getElementById("calday-"+dateStr);
  if(dayEl)dayEl.classList.add("cal-selected");
  m.classList.add("open");
  setTimeout(function(){if(inp)inp.focus();},100);
}
function closeDayNoteModal(){
  var m=document.getElementById("day-note-modal");
  if(m)m.classList.remove("open");
  document.querySelectorAll(".cal-day.cal-selected").forEach(function(el){el.classList.remove("cal-selected");});
  _dayNoteDate=null;
}
async function saveDayNote(){
  if(!_dayNoteDate)return;
  var inp=document.getElementById("dnn-inp");
  var note=(inp&&inp.value||"").trim();
  var entry=G.calData[_dayNoteDate]||(G.calData[_dayNoteDate]={w:0,s:0,m:[]});
  entry.note=note;
  entry.noteType=_dayNoteDate>G.today?"pendiente":"aprendizaje";
  await sbWrite("portal-cal-"+G.sid,G.calData);
  closeDayNoteModal();
  var calEl=document.getElementById("calendar-inner");if(calEl)calEl.innerHTML=buildCalendar();
}

function sendBrowserNotif(title,body){
  if(!("Notification" in window))return;
  if(Notification.permission==="granted"){
    try{new Notification(title,{body:body,icon:"icon.png",badge:"icon.png",tag:"inamovible-app"});}catch(e){}
  }
}

function requestNotifPermission(){
  if(!("Notification" in window))return;
  if(Notification.permission==="default"){
    Notification.requestPermission();
  }
}

async function checkNotifs(st,ev,calData){
  var today=G.today;
  var lsKey="ina_notif_"+G.sid+"_"+today;
  var shown={};
  try{shown=JSON.parse(localStorage.getItem(lsKey)||"{}");} catch(e){}

  // Motivacional diario — una vez al día, frase no repetida
  if(!shown.quote){
    var q=await getNextQuote();
    showQuoteModal(q);
    sendBrowserNotif("INAMOVIBLE",q);
    shown.quote=1;
  }

  // Alerta: membresía por vencer o vencida
  if(!shown.pay&&st.nextPayDate){
    var np=new Date(st.nextPayDate),now=new Date();now.setHours(0,0,0,0);
    var diff=Math.round((np-now)/86400000);
    if(diff<0){
      showToast("MEMBRESÍA VENCIDA","Tu membresía venció hace "+Math.abs(diff)+" día"+(Math.abs(diff)>1?"s":"")+". Habla con tu coach.","alert",false);
      sendBrowserNotif("Membresía vencida","Tu membresía venció hace "+Math.abs(diff)+" días. Habla con tu coach.");
      shown.pay=1;
    }else if(diff<=5){
      showToast("MEMBRESÍA","Tu membresía vence en "+diff+" día"+(diff>1?"s":"")+". Renueva a tiempo.","warn",false);
      sendBrowserNotif("Membresía por vencer","Vence en "+diff+" días. Renueva a tiempo.");
      shown.pay=1;
    }
  }

  // Alerta: evaluación muy antigua (>35 días)
  if(!shown.eval&&ev&&ev.date){
    var evDate=new Date(ev.date);var daysSince=Math.floor((new Date()-evDate)/86400000);
    if(daysSince>35){
      showToast("EVALUACIÓN","Tu última evaluación fue hace "+daysSince+" días. Habla con tu coach para programar una nueva.","warn",false);
      sendBrowserNotif("Evaluación pendiente","Tu última evaluación fue hace "+daysSince+" días.");
      shown.eval=1;
    }
  }

  // Alerta: 5+ días sin marcar entrenamiento
  if(!shown.streak){
    var daysBack=0,daysNoWorkout=0;
    for(var d=0;d<10;d++){
      var dd=new Date(today);dd.setDate(dd.getDate()-d);
      var dowA=dd.getDay();
      var dk=dd.toISOString().slice(0,10);
      var entry=calData[dk];
      if(dowA===0||dowA===6)continue;
      if(!entry||!entry.w)daysNoWorkout++;else break;
    }
    if(daysNoWorkout>=5){
      showToast("SIN REGISTROS","Llevas "+daysNoWorkout+" días sin marcar entrenamiento. ¿Todo bien?","warn",false);
      sendBrowserNotif("Sin registros","Llevas "+daysNoWorkout+" días sin marcar entrenamiento.");
      shown.streak=1;
    }
  }

  try{localStorage.setItem(lsKey,JSON.stringify(shown));}catch(e){}
}
