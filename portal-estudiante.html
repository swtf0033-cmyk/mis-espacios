<!doctype html>
<html>
<head>
<meta charset=utf8>
<meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mi Portal · INAMOVIBLE</title>
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="INAMOVIBLE">
<meta name="theme-color" content="#080808">
<link rel=stylesheet href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#080808;--surf:#111111;--card:#141414;--card2:#1A1A1A;--border:#242424;--border2:#2E2E2E;
  --acc:#C8102E;--acc-d:rgba(200,16,46,.14);--acc-d2:rgba(200,16,46,.07);
  --txt:#F2F2F2;--txt2:#777777;--txt3:#333333;
  --green:#34D399;--green-d:rgba(52,211,153,.12);
  --warn:#FBBF24;--warn-d:rgba(251,191,36,.12);
  --danger:#F87171;--danger-d:rgba(248,113,113,.12);
  color-scheme:dark
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh}
#login{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;position:relative;overflow:hidden}
#login::before{content:'';position:absolute;top:0;left:0;right:0;bottom:0;background:repeating-linear-gradient(0deg,transparent,transparent 39px,rgba(255,255,255,.018) 40px);pointer-events:none}
#login::after{content:'';position:absolute;bottom:0;left:0;right:0;height:2px;background:var(--acc)}
.login-card{background:var(--card);border:1px solid var(--border2);border-top:2px solid var(--acc);border-radius:4px;padding:36px 28px;width:100%;max-width:360px;position:relative;z-index:1}
.login-logo{font-family:'Oswald',sans-serif;font-weight:700;font-size:32px;color:var(--txt);letter-spacing:.08em;text-transform:uppercase;text-align:center;margin-bottom:2px}
.login-logo span{color:var(--acc)}
.login-sub{font-size:11px;color:var(--txt2);text-align:center;margin-bottom:28px;text-transform:uppercase;letter-spacing:.1em}
.fl{font-size:11px;font-weight:600;color:var(--txt2);text-transform:uppercase;letter-spacing:.7px;margin-bottom:6px;display:block}
.fi{width:100%;background:var(--surf);border:1px solid var(--border);color:var(--txt);border-radius:3px;padding:11px 14px;font-size:14px;font-family:'Inter',sans-serif;outline:none;transition:border-color .2s;margin-bottom:14px}
.fi:focus{border-color:var(--acc)}
.login-btn{width:100%;background:var(--acc);color:#fff;border:none;border-radius:3px;padding:13px;font-size:13px;font-weight:700;font-family:'Oswald',sans-serif;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;margin-top:4px;transition:opacity .2s}
.login-btn:disabled{opacity:.6;cursor:default}
.login-err{color:var(--danger);font-size:12px;text-align:center;margin-top:10px;min-height:18px}
#app{display:none;flex-direction:column;min-height:100vh}
.app-header{background:#000;border-bottom:1px solid var(--border);border-bottom-color:var(--acc);padding:11px 22px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10}
.app-logo{font-family:'Oswald',sans-serif;font-weight:700;font-size:19px;color:var(--txt);letter-spacing:.1em;text-transform:uppercase}
.app-logo span{color:var(--acc)}
.app-name{font-size:13px;font-weight:600}
.app-obj{font-size:10px;color:var(--txt2)}
.logout-btn{background:none;border:1px solid var(--border2);color:var(--txt2);font-size:10px;font-family:'Oswald',sans-serif;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:5px 12px;border-radius:2px;cursor:pointer;flex-shrink:0;transition:border-color .15s,color .15s}
.logout-btn:hover{border-color:var(--txt2);color:var(--txt)}
.app-body{padding:16px 20px 40px;max-width:1100px;margin:0 auto;width:100%}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
@media(max-width:720px){.two-col{grid-template-columns:1fr}}
.col{display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border:1px solid var(--border);border-radius:4px;padding:16px;border-top:1px solid var(--border2)}
.ct{font-family:'Oswald',sans-serif;font-weight:700;font-size:15px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:12px;display:flex;align-items:center;gap:6px}
.badge{display:inline-flex;align-items:center;padding:2px 9px;border-radius:99px;font-size:10px;font-weight:600;line-height:1.4}
.bg{background:var(--green-d);color:var(--green)}
.bw{background:var(--warn-d);color:var(--warn)}
.bd{background:var(--danger-d);color:var(--danger)}
.ba{background:var(--acc-d);color:var(--acc)}
.section-lbl{font-size:10px;font-weight:600;color:var(--txt2);text-transform:uppercase;letter-spacing:.06em;margin-bottom:7px}
.section-date{font-size:10px;color:var(--txt2);margin-bottom:10px}
.divider{height:1px;background:var(--border);margin:12px 0}
/* INFO TOGGLE */
.info-toggle{background:none;border:none;color:var(--acc);font-size:11px;font-family:'Inter',sans-serif;cursor:pointer;padding:0;display:inline-flex;align-items:center;gap:4px;font-weight:500}
.info-box{background:var(--surf);border:1px solid var(--border);border-radius:9px;padding:12px;margin-top:8px;display:none}
.info-box.open{display:block}
.info-box table{width:100%;border-collapse:collapse;font-size:11px}
.info-box th{color:var(--txt2);font-weight:600;text-align:left;padding:4px 6px 4px 0;border-bottom:1px solid var(--border)}
.info-box td{padding:5px 6px 5px 0;border-bottom:1px solid var(--border);line-height:1.4;vertical-align:top}
.info-box tr:last-child td{border-bottom:none}
.info-box td:first-child{font-weight:600;white-space:nowrap;color:var(--acc);padding-right:10px}
/* NOTIF BANNER */
.notif-banner{position:fixed;top:60px;right:14px;z-index:200;display:flex;flex-direction:column;gap:8px;max-width:320px;pointer-events:none}
.notif-toast{background:var(--card);border:1px solid var(--border2);border-left:3px solid var(--acc);border-radius:4px;padding:12px 14px;pointer-events:all;display:flex;gap:10px;align-items:flex-start;box-shadow:0 8px 32px rgba(0,0,0,.6);animation:notif-in .25s ease}
.notif-toast.nt-ok{border-left-color:var(--green)}
.notif-toast.nt-warn{border-left-color:var(--warn)}
.notif-toast.nt-alert{border-left-color:var(--danger)}
.notif-icon{flex-shrink:0;margin-top:1px;opacity:.9}
.notif-body{flex:1;min-width:0}
.notif-title{font-family:'Oswald',sans-serif;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--txt);margin-bottom:2px}
.notif-msg{font-size:11px;color:var(--txt2);line-height:1.4}
.notif-close{flex-shrink:0;background:none;border:none;color:var(--txt3);font-size:14px;cursor:pointer;padding:0;line-height:1;margin-top:-1px;transition:color .15s}
.notif-close:hover{color:var(--txt)}
@keyframes notif-in{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}
@media(max-width:480px){.notif-banner{left:10px;right:10px;max-width:100%}}
/* PROFILE */
.prof-row{display:flex;align-items:center;gap:14px}
.prof-avatar{width:52px;height:52px;border-radius:50%;background:var(--acc);display:flex;align-items:center;justify-content:center;font-family:'Oswald',sans-serif;font-weight:700;font-size:22px;color:#fff;flex-shrink:0}
.prof-name{font-family:'Oswald',sans-serif;font-size:17px;font-weight:700;letter-spacing:.06em}
.prof-obj{font-size:11px;color:var(--txt2);margin-top:2px}
.prof-meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.prof-tag{background:var(--surf);border:1px solid var(--border);border-radius:2px;padding:3px 8px;font-size:10px;color:var(--txt2)}
.prof-msg{font-size:10px;color:var(--txt3);margin-top:9px;font-style:italic}
/* NOTES */
.notes-list{display:flex;flex-direction:column;gap:6px;max-height:260px;overflow-y:auto;margin-bottom:8px}
.note-b{padding:8px 11px;border-radius:3px;font-size:11px;line-height:1.5}
.note-b.nc{background:var(--surf);border:1px solid var(--border);border-left:2px solid var(--acc)}
.note-b.ns{background:var(--acc-d2);border:1px solid var(--acc-d);border-left:2px solid var(--green)}
.note-meta{font-size:9px;color:var(--txt3);margin-top:3px}
.note-send-row{display:flex;gap:6px;margin-top:4px}
.note-inp{flex:1;background:var(--surf);border:1px solid var(--border);color:var(--txt);border-radius:3px;padding:8px 10px;font-size:12px;font-family:'Inter',sans-serif;outline:none;resize:none;min-height:36px}
.note-inp:focus{border-color:var(--acc)}
.note-send-btn{background:var(--acc);color:#fff;border:none;border-radius:3px;padding:0 14px;font-size:11px;font-weight:700;font-family:'Oswald',sans-serif;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
/* BADGES */
.badges-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.badge-item{background:var(--surf);border:1px solid var(--border);border-radius:3px;padding:9px 6px;text-align:center}
.badge-item.earned{border-color:var(--acc);background:var(--acc-d2)}
.badge-icon{font-size:20px;opacity:.2;display:block;margin-bottom:3px}
.badge-item.earned .badge-icon{opacity:1}
.badge-lbl{font-size:9px;color:var(--txt2);text-transform:uppercase;letter-spacing:.05em;line-height:1.3}
.badge-dt{font-size:8px;color:var(--acc);margin-top:2px}
/* RANKING */
.rank-row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--border)}
.rank-row:last-child{border-bottom:none}
.rank-num{font-family:'Oswald',sans-serif;font-size:17px;font-weight:700;color:var(--txt3);width:22px;flex-shrink:0;text-align:center}
.rank-name{flex:1;font-size:12px;font-weight:600}
.rank-pts{font-family:'Oswald',sans-serif;font-size:13px;color:var(--txt2)}
.rank-row.me .rank-num,.rank-row.me .rank-pts{color:var(--acc)}
.rank-row.me .rank-name{color:var(--txt)}
/* BOOK */
.book-prog-wrap{background:var(--border);border-radius:99px;height:5px;overflow:hidden;margin:7px 0 4px}
.book-prog-fill{height:100%;border-radius:99px;background:var(--acc)}
.book-page-row{display:flex;gap:6px;align-items:center;margin-top:6px}
.book-inp{background:var(--surf);border:1px solid var(--border);color:var(--txt);border-radius:3px;padding:5px 9px;font-size:12px;font-family:'Inter',sans-serif;width:80px;outline:none}
.book-inp:focus{border-color:var(--acc)}
.book-btn{background:var(--acc-d);border:1px solid var(--acc);color:var(--acc);border-radius:3px;padding:5px 10px;font-size:11px;font-weight:600;cursor:pointer}
.book-fin-btn{background:var(--green-d);border:1px solid var(--green);color:var(--green);border-radius:3px;padding:5px 10px;font-size:11px;font-weight:600;cursor:pointer}
.book-add-row{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.book-add-inp{background:var(--surf);border:1px solid var(--border);color:var(--txt);border-radius:3px;padding:8px 10px;font-size:12px;font-family:'Inter',sans-serif;outline:none}
.book-add-inp:focus{border-color:var(--acc)}
.book-start-btn{background:var(--acc);color:#fff;border:none;border-radius:3px;padding:9px;font-size:11px;font-weight:700;font-family:'Oswald',sans-serif;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
.book-hist{margin-top:8px;font-size:10px;color:var(--txt2)}
.book-hist-item{padding:4px 0;border-bottom:1px solid var(--border)}
.book-hist-item:last-child{border-bottom:none}
/* MONTH STEPS */
.msteps-lbl{font-size:10px;margin-top:6px}
/* IMC SCALE */
.imc-scale{margin:10px 0 8px}
.imc-bar{display:flex;height:8px;border-radius:99px;overflow:hidden;margin-bottom:6px}
.imc-label-row{display:flex;justify-content:space-between;font-size:9px;color:var(--txt2);position:relative;height:16px;align-items:flex-end}
.imc-needle-wrap{position:absolute;top:-16px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;pointer-events:none}
.imc-needle-arrow{font-size:8px;color:var(--txt);line-height:1}
.imc-needle-line{width:1px;height:12px;background:var(--txt)}
/* PLAN */
.week-list{display:flex;flex-direction:column;gap:6px}
.week-item{background:var(--surf);border:1px solid var(--border);border-radius:3px;padding:10px 13px;display:flex;align-items:center;gap:10px}
.week-item.cur{border-color:var(--acc);border-left:3px solid var(--acc);background:var(--acc-d2)}
.wnum{font-family:'Oswald',sans-serif;font-size:22px;font-weight:700;color:var(--txt3);width:30px;flex-shrink:0;letter-spacing:.04em}
.week-item.cur .wnum{color:var(--acc)}
.winfo{flex:1;min-width:0}
.wtype{font-size:12px;font-weight:600}
.wdetail{font-size:10px;color:var(--txt2);margin-top:1px}
.wnow{font-size:10px;font-weight:700;color:var(--acc);background:var(--acc-d);padding:2px 8px;border-radius:2px;flex-shrink:0;text-transform:uppercase;letter-spacing:.06em;font-family:'Oswald',sans-serif}
/* METRIC CARDS */
.metric-scroll{display:flex;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px;margin-bottom:10px;scrollbar-width:none}
.metric-scroll::-webkit-scrollbar{display:none}
.metric-card{background:var(--surf);border:1px solid var(--border);border-top:2px solid var(--border2);border-radius:3px;padding:14px 13px;min-width:148px;flex-shrink:0;display:flex;flex-direction:column;gap:3px}
.metric-card-lbl{font-size:9px;font-weight:700;color:var(--txt2);text-transform:uppercase;letter-spacing:.1em;font-family:'Oswald',sans-serif}
.metric-card-val{font-family:'Oswald',sans-serif;font-size:32px;font-weight:700;color:var(--txt);line-height:1;margin:4px 0 2px}
.metric-card-unit{font-size:10px;color:var(--txt2);font-weight:500;letter-spacing:.04em}
.metric-card-desc{font-size:10px;color:var(--txt2);line-height:1.4;margin-top:4px}
/* STATS GRID (circunferencias) */
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}
.stat-box{background:var(--surf);border:1px solid var(--border);border-radius:3px;padding:11px;text-align:center}
.stat-val{font-family:'Oswald',sans-serif;font-size:24px;font-weight:700;color:var(--txt);line-height:1}
.stat-lbl{font-size:9px;color:var(--txt2);text-transform:uppercase;letter-spacing:.06em;margin-top:3px}
/* RM */
.rm-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.rm-card{background:var(--surf);border:1px solid var(--border);border-left:2px solid var(--border2);border-radius:3px;padding:11px}
.rm-icon{font-size:16px;margin-bottom:4px}
.rm-name{font-size:10px;color:var(--txt2);margin-bottom:3px;line-height:1.3;min-height:26px;text-transform:uppercase;letter-spacing:.04em}
.rm-val{font-family:'Oswald',sans-serif;font-size:22px;font-weight:700;color:var(--txt);line-height:1}
.rm-date{font-size:9px;color:var(--txt3);margin-top:2px}
/* CHECK BTN */
.check-btn{display:flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;border:2px solid var(--border2);background:transparent;cursor:pointer;color:var(--txt2);font-size:15px;transition:all .18s;flex-shrink:0}
.check-btn.done{border-color:var(--acc);background:var(--acc-d);color:var(--acc)}
.check-btn:active{transform:scale(.9)}
/* TODAY */
.today-block{background:var(--surf);border:1px solid var(--border);border-left:3px solid var(--border2);border-radius:3px;padding:12px;display:flex;align-items:flex-start;gap:8px;transition:border-color .2s}
.today-block.done-block{border-left-color:var(--acc);background:var(--acc-d2)}
.today-block-icon{font-size:22px;flex-shrink:0;margin-top:1px}
.today-block-info{flex:1;min-width:0}
.today-block-name{font-size:12px;font-weight:600}
.today-block-sub{font-size:10px;color:var(--txt2);margin-top:1px}
/* TIME PILLS */
.time-pills{display:flex;gap:5px;margin-top:6px;flex-wrap:wrap}
.time-pill{padding:4px 10px;border-radius:99px;font-size:10px;font-weight:600;cursor:pointer;border:1px solid var(--border2);background:transparent;color:var(--txt2);font-family:'Inter',sans-serif;transition:all .15s}
.time-pill{padding:4px 10px;border-radius:2px;font-size:10px;font-weight:600;cursor:pointer;border:1px solid var(--border2);background:transparent;color:var(--txt2);font-family:'Oswald',sans-serif;letter-spacing:.06em;text-transform:uppercase;transition:all .15s}
.time-pill.on{border-color:var(--acc);background:var(--acc-d);color:var(--acc)}
/* STEP GOAL */
.step-goal-row{display:flex;align-items:center;gap:7px;margin-top:7px}
.step-goal-inp{background:var(--card);border:1px solid var(--border);color:var(--txt);border-radius:7px;padding:5px 9px;font-size:12px;font-family:'Inter',sans-serif;width:90px;outline:none}
.step-goal-inp:focus{border-color:var(--acc)}
.step-save-btn{background:var(--acc-d);border:1px solid var(--acc);color:var(--acc);border-radius:7px;padding:5px 10px;font-size:11px;font-weight:600;font-family:'Inter',sans-serif;cursor:pointer}
.step-bar-wrap{margin-top:6px;background:var(--border);border-radius:99px;height:4px;overflow:hidden}
.step-bar-fill{height:100%;border-radius:99px;background:var(--warn)}
.edit-link{background:none;border:none;font-size:10px;color:var(--txt2);cursor:pointer;padding:4px 0 0;font-family:'Inter',sans-serif;text-decoration:underline}
/* MEAL */
.meal-row{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border)}
.meal-row:last-child{border-bottom:none}
.meal-info{flex:1;min-width:0}
.meal-name{font-size:12px;font-weight:600}
.meal-detail{font-size:10px;color:var(--txt2);margin-top:1px}
.meal-kcal{font-family:'Oswald',sans-serif;font-size:16px;font-weight:700;color:var(--warn);margin-right:8px}
/* MEAL COUNT SEL */
.meal-count-sel{display:flex;gap:5px}
.mcs-btn{flex:1;padding:5px 7px;background:var(--surf);border:1px solid var(--border);border-radius:7px;color:var(--txt2);font-size:11px;font-weight:600;cursor:pointer;text-align:center;transition:all .15s;font-family:'Inter',sans-serif}
.mcs-btn.on{background:var(--acc-d);border-color:var(--acc);color:var(--acc)}
/* CAL TODAY */
.cal-day.today{border-color:var(--acc);background:var(--acc-d2)!important}
.cal-day.today .cal-dn{color:var(--acc)}
/* MACROS */
.macro-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.macro-lbl{font-size:11px;font-weight:600;width:88px;flex-shrink:0}
.macro-bar{flex:1;height:5px;background:var(--border);border-radius:99px;overflow:hidden}
.macro-fill{height:100%;border-radius:99px}
.macro-val{font-size:10px;font-weight:600;width:70px;text-align:right;flex-shrink:0;color:var(--txt)}
.kcal-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.kcal-box{background:var(--surf);border-radius:9px;padding:10px;text-align:center}
.kcal-val{font-family:'Oswald',sans-serif;font-size:20px;font-weight:700}
.kcal-lbl{font-size:9px;color:var(--txt2);text-transform:uppercase;letter-spacing:.5px;margin-top:2px}
/* DISCLAIMER */
.disclaimer-box{background:var(--surf);border:1px solid var(--border2);border-radius:10px;padding:16px}
.disclaimer-title{font-size:13px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:6px;color:var(--warn)}
.disclaimer-list{list-style:none;padding:0;margin:0 0 14px}
.disclaimer-list li{font-size:11px;color:var(--txt2);padding:6px 0;border-bottom:1px solid var(--border);display:flex;gap:8px;line-height:1.5}
.disclaimer-list li:last-child{border-bottom:none}
.disclaimer-list li::before{content:'⚠';flex-shrink:0;color:var(--warn)}
.disclaimer-accept{width:100%;background:var(--acc);color:#fff;border:none;border-radius:2px;padding:12px;font-size:12px;font-weight:700;font-family:'Oswald',sans-serif;letter-spacing:.12em;text-transform:uppercase;cursor:pointer}
/* CALENDARIO */
.cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.cal-month{font-family:'Oswald',sans-serif;font-size:16px;font-weight:700}
.cal-nav{background:none;border:1px solid var(--border);color:var(--txt2);border-radius:6px;padding:4px 10px;cursor:pointer;font-size:12px;font-family:'Inter',sans-serif}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-dow{font-size:9px;font-weight:700;color:var(--txt3);text-align:center;padding:4px 0;text-transform:uppercase}
.cal-day{border-radius:2px;padding:5px 3px;min-height:52px;background:var(--surf);border:1px solid var(--border)}
.cal-day.empty{background:transparent;border-color:transparent}
.cal-day.future{opacity:.3}
.cal-dn{font-size:10px;font-weight:700;color:var(--txt2);margin-bottom:3px;font-family:'Oswald',sans-serif;letter-spacing:.04em}
.cal-dots{display:flex;gap:2px;flex-wrap:wrap}
.cal-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.dot-w{background:var(--acc)}
.dot-s{background:var(--warn)}
.dot-m{background:var(--green)}
.dot-empty{background:var(--border)}
/* MEMBRESÍA */
.mem-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border)}
.mem-row:last-child{border-bottom:none}
.mem-key{font-size:11px;color:var(--txt2)}
.mem-val{font-size:12px;font-weight:600}
/* UTILS */
.spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.2);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-wrap{display:flex;align-items:center;justify-content:center;padding:60px;gap:12px;color:var(--txt2);font-size:13px}
/* MOBILE */
@media(max-width:600px){
  .app-header{padding:10px 14px;gap:8px}
  .app-logo{font-size:17px}
  .app-name{font-size:12px}
  .app-obj{font-size:9px}
  .logout-btn{padding:4px 9px;font-size:10px}
  .app-body{padding:10px 11px 32px}
  .card{padding:13px 12px}
  .ct{font-size:14px;margin-bottom:10px}
  .metric-card{min-width:130px;padding:11px 10px}
  .metric-card-val{font-size:24px}
  .metric-card-desc{font-size:9px}
  .stats-grid{grid-template-columns:repeat(2,1fr);gap:6px}
  .kcal-row{gap:6px}
  .kcal-box{padding:8px 6px}
  .kcal-val{font-size:16px}
  .cal-grid{gap:2px}
  .cal-day{min-height:44px;padding:4px 2px}
  .cal-dn{font-size:9px}
  .cal-dot{width:6px;height:6px}
  .today-block{padding:10px}
  .today-block-icon{font-size:18px}
  .rm-grid{grid-template-columns:1fr 1fr}
  .week-item{padding:8px 10px;gap:8px}
  .wnum{font-size:18px;width:24px}
  .meal-count-sel{gap:4px}
  .mcs-btn{padding:4px 5px;font-size:10px}
  .macro-lbl{width:76px;font-size:10px}
  .macro-val{font-size:9px;width:60px}
  .time-pills{gap:4px}
  .time-pill{padding:3px 8px;font-size:9px}
  .info-box table{font-size:10px}
  .info-box td,.info-box th{padding:4px 4px 4px 0}
  .disclaimer-list li{font-size:10px}
}
/* PROGRESO */
.progreso-section{margin-bottom:20px}
.progreso-cat-title{font-family:'Oswald',sans-serif;font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--txt2);text-transform:uppercase;margin-bottom:8px}
.logro-list{display:flex;flex-direction:column;gap:4px}
.logro-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:3px;border:1px solid var(--border)}
.logro-item.earned{background:var(--surf);border-color:var(--border2)}
.logro-item.next{background:var(--acc-d);border-color:var(--acc);border-left:3px solid var(--acc)}
.logro-item.locked{opacity:.3}
.logro-num{font-family:'Oswald',sans-serif;font-weight:700;font-size:18px;color:var(--acc);min-width:36px}
.logro-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;flex:1}
.logro-date{font-size:10px;color:var(--txt2)}
.logro-target{font-family:'Oswald',sans-serif;font-weight:700;font-size:18px;color:var(--acc);min-width:50px}
.logro-progress{font-size:10px;color:var(--txt2);white-space:nowrap}
.racha-display{font-size:12px;color:var(--txt2);margin-bottom:10px;padding:8px 0;border-bottom:1px solid var(--border)}
.racha-num{font-family:'Oswald',sans-serif;font-weight:700;font-size:20px;color:var(--txt)}
/* DIARIO */
.diario-q{font-size:13px;font-weight:600;line-height:1.5;margin-bottom:10px;color:var(--txt)}
.diario-inp{width:100%;background:var(--surf);border:1px solid var(--border);color:var(--txt);border-radius:3px;padding:10px;font-size:12px;font-family:'Inter',sans-serif;outline:none;resize:vertical;min-height:80px}
.diario-inp:focus{border-color:var(--acc)}
.diario-btn{background:var(--acc);color:#fff;border:none;border-radius:3px;padding:9px 16px;font-size:11px;font-weight:700;font-family:'Oswald',sans-serif;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;margin-top:8px}
/* OBSTACULO */
.obs-inp{width:100%;background:var(--surf);border:1px solid var(--border);color:var(--txt);border-radius:3px;padding:10px;font-size:12px;font-family:'Inter',sans-serif;outline:none;resize:vertical;min-height:60px;margin-bottom:8px}
.obs-inp:focus{border-color:var(--acc)}
.obs-hist-item{padding:8px 10px;background:var(--surf);border:1px solid var(--border);border-radius:3px;margin-bottom:6px;font-size:11px;line-height:1.5}
.obs-hist-date{font-size:9px;color:var(--txt3);margin-top:4px}
.obs-q{font-size:11px;font-weight:600;color:var(--txt2);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
</style>

async function sha256(msg){
  var buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(msg));
  return Array.from(new Uint8Array(buf)).map(function(b){return b.toString(16).padStart(2,'0');}).join('');
}

  var d=await r.json();
  return(Array.isArray(d)&&d.length)?d[0].value:null;
}
async function sbWrite(key,value){
  try{

      method:"POST",

      body:JSON.stringify({key:LSK+key,value:value,updated_at:new Date().toISOString()})

}

  setLoading(true);
  try{
    var portales=await fetchSbKey("portales");
    if(!Array.isArray(portales)){showErr("Error de conexión");setLoading(false);return;}
    var hash=await sha256(pass);
    var entry=portales.find(function(p){return p.username===uname&&p.pwdHash===hash;});
    if(!entry){showErr("Usuario o contraseña incorrectos");setLoading(false);return;}
    sessionStorage.setItem("portal_sid",entry.studentId);
    await loadDashboard(entry.studentId);
  }catch(e){showErr("Error de conexión");}
  setLoading(false);
}

function parseHeight(raw){var h=parseFloat(raw)||0;return h>3?h:h>0?Math.round(h*100):0;}
function calcMacros(){
  var st=G.st,ev=G.evals&&G.evals.length?G.evals[0]:null;
  var wkg=parseFloat((ev&&ev.weight)||st.weight)||70;
  var hcm=parseHeight(st.height)||170;
  var age=parseInt(st.age)||25,sex=st.sex||"M";
  var act=parseFloat((G.nutrition&&G.nutrition.activity)||"1.55");
  var goal=(G.nutrition&&G.nutrition.goal)||"mant";
  var tmb=sex==="M"?(10*wkg)+(6.25*hcm)-(5*age)+5:(10*wkg)+(6.25*hcm)-(5*age)-161;
  tmb=Math.round(tmb);
  var tdee=Math.round(tmb*act);
  var kcal=goal==="deficit"?tdee-300:goal==="superavit"?tdee+300:tdee;
  var pPct=sex==="M"?30:28,cPct=goal==="superavit"?45:goal==="deficit"?35:40,fPct=100-pPct-cPct;
  return{tmb:tmb,tdee:tdee,kcal:kcal,pPct:pPct,cPct:cPct,fPct:fPct,
    protG:Math.round((kcal*pPct/100)/4),carbG:Math.round((kcal*cPct/100)/4),fatG:Math.round((kcal*fPct/100)/9),
    wkg:wkg,act:act,goal:goal,hcm:hcm,age:age,sex:sex};
}

function buildMealsHtml(){

    var pk=Math.round(macro.protG*pct/100),ck=Math.round(macro.carbG*pct/100),fk=Math.round(macro.fatG*pct/100),kc=Math.round(macro.kcal*pct/100);
    var done=e.m[i]?1:0;
    html+='<div class="meal-row"><div class="meal-info"><div class="meal-name">'+esc(names[i])+'</div><div class="meal-detail">P:'+pk+'g · C:'+ck+'g · G:'+fk+'g</div></div>'+

  return html;
}

function buildImcScale(imc,wkg,hcm){
  if(!imc)return'';
  // Bar flex: Bajo(18.5) Normal(6.5) Sobrepeso(5) Obesidad(10) = 40 total
  // Zone boundaries in %: 0 → 46.25 → 62.5 → 75 → 100
  var pct=0;
  if(imc<=18.5) pct=(imc/18.5)*46.25;
  else if(imc<=25) pct=46.25+((imc-18.5)/6.5)*16.25;
  else if(imc<=30) pct=62.5+((imc-25)/5)*12.5;
  else pct=Math.min(75+((imc-30)/15)*22,97);
  pct=Math.max(1,Math.min(97,pct));
  var cls=imc<18.5?"bw":imc<25?"bg":imc<30?"bw":"bd";
  var lbl=imc<18.5?"Bajo peso":imc<25?"Normal":imc<30?"Sobrepeso":"Obesidad";
  var nextZone=imc<18.5?"Normal":imc<25?"Sobrepeso":imc<30?"Obesidad I":null;
  var nextVal=imc<18.5?18.5:imc<25?25:imc<30?30:null;
  var distLine=nextVal!=null?'<div style="font-size:10px;color:var(--txt2);margin-top:6px">→ A <strong style="color:var(--txt)">'+(Math.round((nextVal-imc)*10)/10)+' pts</strong> de '+nextZone+'</div>':'';
  var withLine=(wkg&&hcm)?'<div style="font-size:10px;color:var(--txt2);margin-top:3px">Con '+wkg+'kg y '+hcm+'cm → IMC '+imc+'. Peso en rango <strong style="color:var(--txt)">'+lbl.toLowerCase()+'</strong> para esta altura.</div>':'';
  return'<div style="margin:0 0 6px">'+
    '<div style="position:relative;padding-bottom:20px;margin-bottom:2px">'+
      '<div style="display:flex;height:8px;border-radius:99px;overflow:hidden">'+
        '<div style="flex:18.5;background:#FBBF24;opacity:.45"></div>'+
        '<div style="flex:6.5;background:#34D399"></div>'+
        '<div style="flex:5;background:#FBBF24;opacity:.7"></div>'+
        '<div style="flex:10;background:#F87171"></div>'+
      '</div>'+
      '<div style="position:absolute;left:'+pct+'%;top:0;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;pointer-events:none">'+
        '<div style="width:2px;height:8px;background:#fff;border-radius:1px"></div>'+
        '<div style="font-size:8px;color:#fff;font-weight:700;white-space:nowrap;background:rgba(0,0,0,.6);padding:1px 4px;border-radius:3px;margin-top:2px">Tú</div>'+
      '</div>'+
      '<div style="display:flex;justify-content:space-between;font-size:9px;color:var(--txt3);position:absolute;bottom:0;left:0;right:0">'+
        '<span>Bajo<br/>&lt;18.5</span><span style="text-align:center">Normal<br/>18.5–25</span><span style="text-align:center">Sobrepeso<br/>25–30</span><span style="text-align:right">Obesidad<br/>&gt;30</span>'+
      '</div>'+
    '</div>'+
    distLine+withLine+
  '</div>';
}

function buildDots(dateStr){
  var e=G.calData[dateStr]||{},mc=G.mealCount;
  var mDone=(e.m||[]).filter(function(x){return x;}).length===mc&&mc>0;
  var mAny=(e.m||[]).some(function(x){return x;});
  return'<div class="cal-dots">'+
    '<div class="cal-dot '+(e.w?"dot-w":"dot-empty")+'" title="Entrenamiento"></div>'+
    '<div class="cal-dot '+(e.s?"dot-s":"dot-empty")+'" title="Pasos"></div>'+
    '<div class="cal-dot '+(mDone?"dot-m":mAny?"dot-m":"dot-empty")+'" style="'+(mAny&&!mDone?"opacity:.45":"")+'" title="Comidas"></div>'+
  '</div>';
}
function buildCalendar(){
  var ym=G.calMonth,parts=ym.split("-"),yr=parseInt(parts[0]),mo=parseInt(parts[1])-1;
  var monthNames=["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
  var first=new Date(yr,mo,1),last=new Date(yr,mo+1,0),startDow=(first.getDay()+6)%7;
  var tp=G.today.split("-"),todayY=parseInt(tp[0]),todayM=parseInt(tp[1])-1,todayD=parseInt(tp[2]);
  var html='<div class="cal-header"><button class="cal-nav" onclick="calNav(-1)">‹</button><div class="cal-month">'+monthNames[mo]+' '+yr+'</div><button class="cal-nav" onclick="calNav(1)">›</button></div>';
  html+='<div class="cal-grid">';
  ["Lu","Ma","Mi","Ju","Vi","Sa","Do"].forEach(function(d){html+='<div class="cal-dow">'+d+'</div>';});
  for(var i=0;i<startDow;i++)html+='<div class="cal-day empty"></div>';
  for(var d=1;d<=last.getDate();d++){
    var dStr=yr+"-"+(mo+1<10?"0":"")+(mo+1)+"-"+(d<10?"0":"")+d;
    var isToday=(yr===todayY&&mo===todayM&&d===todayD);
    var isFuture=new Date(yr,mo,d)>new Date(todayY,todayM,todayD);
    html+='<div class="cal-day'+(isToday?" today":"")+(isFuture?" future":"")+'"><div class="cal-dn">'+d+'</div><div id="caldots-'+dStr+'">'+(!isFuture?buildDots(dStr):"")+'</div></div>';
  }
  html+='</div><div style="margin-top:10px;display:flex;gap:12px;font-size:10px;color:var(--txt2)">'+
    '<span><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--acc);margin-right:4px;vertical-align:middle"></span>Entreno</span>'+
    '<span><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--warn);margin-right:4px;vertical-align:middle"></span>Pasos</span>'+
    '<span><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);margin-right:4px;vertical-align:middle"></span>Comidas</span></div>';
  return html;
}
function calNav(dir){
  var parts=G.calMonth.split("-"),yr=parseInt(parts[0]),mo=parseInt(parts[1])-1;
  mo+=dir;if(mo<0){mo=11;yr--;}if(mo>11){mo=0;yr++;}
  G.calMonth=yr+"-"+(mo+1<10?"0":"")+(mo+1);
  var el=document.getElementById("calendar-inner");if(el)el.innerHTML=buildCalendar();
}

    statsHtml+='<div class="section-lbl" style="margin-top:4px">Circunferencias (cm)</div><div class="stats-grid">';

  document.getElementById("app-body").innerHTML='<div class="two-col"><div class="col">'+leftHtml+'</div><div class="col">'+rightHtml+'</div></div>';

nto retrasa el envejecimiento.","El entrenamiento es medicina preventiva.","Cada set completo es una negación a la mediocridad.","Más músculo, más metabolismo, más vida.","No te midas contra modelos. Mídete contra quien eras.","La postura correcta no es accidente. Es hábito entrenado.","El torso fuerte protege la columna que te sostiene.","Construye capacidades antes de construir estética.","No entrenes para impresionar. Entrena para mejorar.","La respiración correcta es técnica, no accidente.","El movimiento bien ejecutado no caduca.","Cuanto más fuerte, más resiliente. En todo sentido.","Corre aunque sea despacio. Moverse lento bate a no moverse.","El cuerpo que cuidas hoy te sirve en los próximos 40 años.","Cada repetición sin trampas vale el doble.","El rango completo de movimiento construye el músculo completo.","No subestimes el poder de una caminata diaria.","El entrenamiento no tiene que durar horas para ser efectivo.","20 minutos con intención > 2 horas sin foco.","La progresión inteligente evita la lesión innecesaria.","Sé paciente con el proceso. El cuerpo cambia más lento de lo que queremos.","El entrenamiento de fuerza es el mejor anti-aging disponible.","Tu cuerpo dice cuándo parar. Aprende a distinguirlo del miedo a incomodarte.","No estás entrenando para el verano. Estás entrenando para la vida.","Los hábitos de movimiento se acumulan en un cuerpo que funciona bien.","Construye músculo. Construye hueso. Construye salud.","No esperes estar listo. El entrenamiento te prepara.","El gimnasio no es castigo. Es inversión.","Más fuerza en las piernas, más energía en todo el día.","La velocidad del progreso depende de la calidad del esfuerzo.","El entrenamiento inteligente supera al entrenamiento duro.","Lo que no practicas, se pierde.","El cuerpo es plástico. Cambia cuando se lo exiges.","Dormir poco anula los beneficios del entrenamiento.","El calor que sientes en el músculo es el cambio en progreso.","Cada entrenamiento te enseña algo de ti mismo.","El movimiento cura más de lo que imaginas.","La fuerza no es un punto de llegada. Es una dirección.","Construye el hábito. El físico llega solo.","No compares tu inicio con el medio de otro.","Tu mayor competencia no tiene cara. Se llama versión anterior.","La rutina de hoy es el resultado de mañana.",
// ESTOICISMO
"Lo único que controlas es tu respuesta.","Memento mori. Actúa en consecuencia.","No pidas que las cosas sean más fáciles. Pide ser más fuerte.","Vivir bien es más difícil que vivir mucho.","El sabio no lamenta lo que no puede cambiar.","Actúa como si todo dependiera de ti. Acepta como si todo dependiera del destino.","La adversidad no es el enemigo. Es la escuela.","Amor fati: ama lo que te toca vivir.","Nada externo te perturba. Solo tu opinión sobre ello lo hace.","La muerte recuerda la importancia de cada día.","El estoico no suprime el dolor. Lo observa y actúa igual.","Controla el control. Suelta lo incontrolable.","No busques aplausos. Busca integridad.","El sabio actúa bien aunque nadie lo vea.","El carácter se revela en la adversidad.","Lo que no puedes evitar, úsalo.","No te quejes. Actúa o acepta.","Sé la roca que el mar no puede mover.","La fortuna no hace al hombre. Lo revela.","El tiempo es el único recurso no renovable.","Medita sobre la muerte para vivir con urgencia.","No el sufrimiento sino la reacción al sufrimiento te define.","El estoico es libre porque no depende de lo externo.","Haz lo correcto aunque duela. Especialmente entonces.","La fama es ruido. El carácter es sustancia.","No esperes justicia del mundo. Sé justo tú.","El sabio se alegra de lo que tiene sin depender de ello.","Cada obstáculo contiene la lección que necesitas.","Tu opinión sobre las cosas crea tu experiencia de ellas.","El presente es el único lugar donde puedes actuar.","No corras de la dificultad. Corre hacia ella.","La virtud es su propio premio.","Quien se domina a sí mismo, domina todo.","El miedo a la muerte roba más vida que la muerte misma.","No seas esclavo de tus pasiones.","La serenidad no es indiferencia. Es claridad bajo presión.","Lo que resistes, persiste. Lo que enfrentas, se disuelve.","No le pidas al universo comodidad. Pide capacidad.","El estoico no finge que todo está bien. Actúa bien de todas formas.","Cada día es una vida completa en miniatura.","Muere antes de morir. Luego ya no tienes miedo.","Las emociones informan. No deben gobernar.","Acepta el presente. Mejora el futuro. Olvida el pasado.","El carácter no se declara. Se vive.","El hombre que busca aprobación externa no es libre.","Nadie puede quitarte lo que ya no tienes.","La riqueza interior no depende del mercado.","Sé duro con tus hábitos. Sé compasivo con tu proceso.","La tranquilidad no se encuentra. Se construye.","El guerrero interior no entra en pánico. Observa y actúa.","No le temas a la opinión ajena. Témele a tu propia cobardía.","La virtud en la adversidad es la virtud real.","El sabio no necesita que el mundo lo entienda.","Lo que mereces es lo que construyes.","El ruido exterior no puede entrar sin tu permiso.","La vida es corta. Actúa en consecuencia.","No malgastes energía en lo que no puedes cambiar.","El tiempo que pierdes quejándote es tiempo que no usas construyendo.","Vive como si cada día fuera el último. Planifica como si fuera el primero.","No necesitas permiso de nadie para ser quien quieres ser.","La adversidad es la sala de pesas del carácter.","El sabio no tiene enemigos. Tiene maestros disfrazados.","Eres dueño de tus acciones. No de sus consecuencias.","El carácter estoico no se dobla ante el viento. Se curva y regresa.","No el bienestar, sino la virtud, es el fin.","Habla menos. Escucha más. Actúa primero.","Quien no es su propio amo, no es libre de ninguna forma.","El sabio no espera que la vida mejore. Mejora él.","La disciplina estoica no es austeridad. Es prioridad.","La queja es el idioma del que no quiere cambiar.","No confundas confort con paz.","El que domina sus emociones domina la sala.","Lo que piensas sobre ti mismo importa más que lo que piensan los demás.","Vive conforme a la naturaleza. Sé lo que debes ser.","El estoico elige cómo reaccionar. Esa elección lo define.","El sabio vive en el presente. No en sus expectativas.","No te aferres a lo que fue. Construye lo que será.","La adversidad no te hace. Revela lo que ya eres.","El miedo es una señal, no una orden.",
// MENTE/CLARIDAD
"Mente clara, acción directa.","El ruido mental es el mayor obstáculo.","Claridad antes que velocidad.","Piensa menos. Decide más.","La confusión no es ignorancia. Es la mente ordenando.","El foco es la habilidad más escasa del siglo XXI.","Cada pensamiento no actuado es energía perdida.","No multitasking. Monofoco brutal.","La mente entrenada no se dispersa. Elige.","Una cosa a la vez, hecha bien.","El enfoque profundo produce resultados superficiales imposibles.","Silencia el teléfono. Activa el cerebro.","La mente que no descansa, tampoco crea bien.","El ruido exterior se reduce con el orden interior.","No hay claridad sin silencio previo.","Decide quién eres y actúa en consecuencia. Sin debate interno.","La ansiedad vive en el futuro. La depresión en el pasado. La paz en el presente.","No temas a tu mente. Entrénala.","Menos opciones, más decisión.","La disciplina mental es el padre de todas las demás disciplinas.","Tu diálogo interno es el entrenador más importante que tienes.","El cerebro es plástico. Puedes rehacerte.","No eres tus pensamientos. Los observas.","El hábito de pensar bien construye una vida bien.","La intención sin acción es solo imaginación.","El cerebro sigue a los ojos. Cuida lo que consumes.","Una mente ocupada no puede crear.","La calidad de tus preguntas determina la calidad de tu vida.","Pregúntate: ¿esto me acerca o me aleja de quien quiero ser?","No sigas a la emoción. Observa y actúa desde el principio.","El que conoce su mente es más libre que el que conoce el mundo.","El descanso no es perder tiempo. Es cargar energía mental.","El cerebro cambia con lo que haces repetidamente.","Cada decisión pequeña entrena tu voluntad.","No te castigues. Aprende y sigue.","La narrativa que te cuentas construye la vida que tienes.","Cambia la historia que te cuentas. Cambia lo que construyes.","El miedo y el entusiasmo se sienten igual. Elige la interpretación.","Un pensamiento repetido se convierte en creencia.","Una creencia repetida se convierte en realidad.","No hay problema que resistas más tiempo del que lo enfrentas.","La claridad mental es producto del estilo de vida, no solo del esfuerzo.","Medita aunque sea cinco minutos. La mente lo agradece.","El cerebro necesita soledad para integrar lo que aprende.","Sin reflexión, la acción es ruido.","Piensa primero en el resultado. Luego en el proceso.","Tu mente es el campo de batalla más importante.","Elige pensamientos que construyan.","La mente exhausta no toma buenas decisiones.","Claridad > Urgencia.","No reacciones. Responde.","La inteligencia emocional supera al coeficiente intelectual en resultados.","Quien domina su atención domina su vida.","No consumas pasivamente. Crea activamente.","El scroll infinito es el enemigo del pensamiento profundo.","Tu cerebro necesita aburrimiento para innovar.","Las mejores ideas llegan al silencio.","No pienses más. Actúa y ajusta.","El análisis sin acción es parálisis.","La duda es el umbral. Crúzalo.","Confía en el proceso que diseñaste en frío cuando estás en calor.","Tu estado mental construye tu estado físico.","La coherencia entre lo que piensas y haces genera paz interior.","El descanso profundo es entrenamiento mental.","La creatividad nace cuando el cerebro tiene espacio.","No dejes que el ruido de la opinión ajena ahogue tu voz interior.","La mente que no descansa acumula deuda cognitiva.","Reduce la velocidad para ir más lejos.","No todo pensamiento merece ser seguido.","La claridad llega actuando, no pensando.","El contexto mental que construyes es el aire que respiras.","Cuida tu mente como cuidas tu cuerpo.","Lo que entra por los ojos y oídos alimenta tu mente.","Disciplina mental: hacer lo correcto aunque la mente proteste.","La mente fuerte no es la que no siente. Es la que actúa igual.","El ruido interno baja cuando el propósito sube.","Tu cerebro cree lo que repites. Elige bien.","No te rindas con tu mente. Es entrenable.",
// SILENCIO/ACCIÓN
"El que habla mucho hace poco.","El silencio es la respuesta más poderosa.","Actúa. Todo lo demás es opinión.","No anuncies lo que vas a hacer. Muéstralo.","El trabajo silencioso habla más fuerte que la declaración ruidosa.","No necesitas que te entiendan para avanzar.","La acción sin anuncio es la más honesta.","Deja que los resultados sean tu mensaje.","El que menos habla de sus sueños, más trabaja en ellos.","La victoria callada dura más.","Hazlo. Luego cuéntalo si quieres.","No busques aprobación antes de actuar.","El silencio estratégico es una forma de poder.","El que explica demasiado, duda demasiado.","Actúa primero. Explica después, si hace falta.","No publiques el proceso. Muestra el resultado.","La paz viene de hacer, no de planear hacer.","El ruido es el refugio de quienes no actúan.","En el silencio de la acción se construye el carácter.","No esperes el momento perfecto. Crea el momento.","El guerrero habla poco porque sus acciones lo preceden.","El que trabaja en silencio construye sin interrupciones.","No justifiques tu camino. Recórrelo.","La acción constante no necesita audiencia.","Cada día sin acción es un día de deuda con tu futuro.","El silencio es la disciplina de los que ya saben qué hacer.","Habla menos. Construye más.","El éxito no pide permiso para existir.","No esperes señales. Empieza.","La indecisión es la decisión de no avanzar.","El momento es ahora. Siempre ha sido ahora.","Actuar mal supera a planear perfecto.","La claridad llega con el movimiento, no antes.","No hay más preparación que hacer.","El impulso se mantiene actuando.","Actúa desde los principios, no desde el humor.","La velocidad de decisión separa a los que logran de los que desean.","No permitas que el perfeccionismo sea inacción disfrazada.","Comenzar siempre es el paso más difícil. Hazlo.","La procrastinación es miedo con mejor excusa.","El tiempo que usas en justificarte podrías usarlo en actuar.","Silencio y acción: la combinación más temida.","No esperes motivación. Créala moviéndote.","La confianza no viene antes de actuar. Viene después.","El que actúa en silencio construye sin comparaciones.","No hay espectador en tu propio progreso. Solo tú.","La acción rompe el ciclo de la duda.","Menos palabras, más hechos.","No digas que vas a cambiar. Cambia.","El silencio de quien trabaja vale más que mil declaraciones.",
// TIEMPO/URGENCIA
"El tiempo no espera a quien duda.","Hoy que tienes salud, úsala.","No desperdicies el día que tienes.","Cada mañana es una segunda oportunidad.","El tiempo perdido no se recupera. El músculo sí, si actúas.","Eres finito. Actúa como si lo supieras.","Memento mori: el tiempo se acaba. Empléalo bien.","No hay tiempo para no estar en tu mejor versión.","El reloj no para para quien no se mueve.","Cada día sin crecer es un día de deuda con quien puedes ser.","El hoy determina el mañana que querrás recordar.","No postergues lo que importa por lo que urge.","El urgente mata al importante si lo dejas.","Haz lo importante antes de que se vuelva urgente.","La procrastinación roba días que no vuelven.","Diez años pasan de todas formas. ¿Qué harás con ellos?","No hay versión de ti del futuro sin el trabajo del presente.","Cada minuto de entrenamiento es un minuto invertido en tu libertad.","El tiempo que dedicaste al entrenamiento nadie te lo quita.","No hay retiro para quien no construyó.","Comienza hoy. El comienzo tardío sigue siendo un comienzo.","No hay momento perfecto. Solo hay ahora.","El cuerpo envejece. El hábito lo retrasa.","El tiempo no perdona la pasividad.","Invierte en tu cuerpo ahora o págale al médico después.","El que no actúa hoy trabaja para sus excusas mañana.","El tiempo que pasas quejándote es tiempo que no inviertes.","Esta semana va a pasar de todos modos. Decide qué harás con ella.","Cada día es una unidad de construcción.","La urgencia de vivir bien no llega. La decides tú.","No hay después. Solo hay ahora y sus consecuencias.","Eres más joven hoy que mañana. Actúa.","El tiempo es el activo que nadie puede devolverte.","La inacción es una decisión activa de no crecer.","No esperes al lunes. El lunes ya llegó.","Cada hora empleada bien es una hora que trabaja para ti.","El presente no es una sala de espera.","El tiempo que inviertes en tus hábitos tiene retorno compuesto.","Haz hoy lo que tu yo de 70 años agradecerá.","No existe el tiempo libre. Existe el tiempo elegido.",
// IDENTIDAD/CARÁCTER
"Eres lo que haces cuando nadie mira.","No eres tus emociones. Eres tus acciones.","El carácter es quien eres bajo presión.","La identidad no se declara. Se vive.","Sé la persona que tu plan necesita.","No cambies tus metas. Cambia quien eres para alcanzarlas.","El que sabe quién es no necesita validación.","Tu identidad es la suma de tus hábitos.","Conviértete en el tipo de persona que hace lo que dices que vas a hacer.","El carácter no es perfecto. Es consistente.","No actúes por resultados. Actúa por quién quieres ser.","La integridad es la alineación entre lo que piensas, dices y haces.","No finjas tener valores que no vives.","La reputación se construye en privado.","Sé el mismo cuando te ven y cuando no te ven.","El hombre sin principios sigue cualquier viento.","Construye una identidad que no dependa de resultados externos.","Tu forma de hacer una cosa es tu forma de hacer todo.","El carácter no se negocia por comodidad.","Un hombre de palabra es más raro que uno de talento.","La consistencia es la prueba del carácter.","No te definas por tu trabajo, tu físico, ni tus logros. Defínete por tus principios.","El que se conoce a sí mismo no teme a los cambios.","Sé auténtico aunque sea incómodo.","La persona que quieres ser ya está en las decisiones que tomas hoy.","No hay éxito que compense una vida sin integridad.","El carácter se construye en las elecciones que nadie ve.","La fortaleza de carácter es más valiosa que la fuerza física.","No seas lo que el mundo pide. Sé lo que elegiste ser.","Quien no tiene carácter es esclavo de sus circunstancias.","El hombre de carácter hace lo correcto aunque no sea conveniente.","Tu marca personal es lo que haces cuando nadie te paga por hacerlo.","No vendas tu integridad por aprobación.","La identidad sólida resiste la presión del grupo.","No cambies de posición para caerle bien a todos.","Sé congruente con quien eres, no con quien esperan que seas.","El carácter no se improvisa en la crisis. Se trae de antes.","No sigas a la mayoría si la mayoría va en la dirección equivocada.","Tu palabra es tu contrato más importante.","Sé el mismo hombre en la cumbre y en el fondo.",
// ADVERSIDAD/RESILIENCIA
"El obstáculo es el camino.","Lo que no te mata, informa.","Cada caída enseña algo que el éxito no puede.","No pidas una vida sin dificultades. Pide la fuerza para enfrentarlas.","La resiliencia no es rebotar. Es adaptarse y seguir.","El fuego no destruye al oro. Lo purifica.","Las cicatrices son mapas de sobrevivencia.","No te quejes de la tormenta. Conviértete en marinero experto.","La adversidad es el precio de entrada para la grandeza.","El que nunca falló, nunca lo intentó en serio.","Los mejores atletas no evitan el dolor. Aprenden a respetarlo.","No hay historia de éxito sin capítulos de fracaso.","La derrota es información disfrazada de dolor.","El fracaso no es el opuesto del éxito. Es parte de él.","Cae siete veces. Levántate ocho.","El carácter no se forma en la comodidad.","La dificultad es temporal. La rendición, permanente.","No evites los momentos difíciles. Vívelos con conciencia.","Cada obstáculo que superas amplía tu rango de lo posible.","La resiliencia no se declara. Se entrena.","El dolor que evades hoy se convierte en miedo mañana.","El que enfrenta sus miedos los encoge.","No hay versión mejorada de ti sin una versión desafiada de ti.","La adversidad no te crea. Te revela.","El que huye del problema lo agranda.","Enfrenta el monstruo mientras es pequeño.","Cada vez que sigues cuando quieres parar, te construyes.","El que resiste cuando otros se rinden, gana por default.","No esperes que la vida se vuelva más fácil. Vuélvete tú más fuerte.","La historia de tu vida la escribes con decisiones bajo presión.","No hay músculo sin resistencia. No hay carácter sin adversidad.","Cuando todo falla, eres tú lo que queda.","El que no tiene miedo no tiene valor. El valiente actúa a pesar del miedo.","El fracaso frecuente es el precio del aprendizaje real.","Cada crisis es una oportunidad de demostrar quién eres.","No necesitas condiciones perfectas para avanzar.","La vida no se detiene para que te recuperes. Muévete mientras sanas.","El sufrimiento consciente construye. El sufrimiento evitado acumula.","No rompas cuando duele. Ese es el momento exacto para mantenerse.","La adversidad es el entrenador más honesto.",
// LIBROS/CRECIMIENTO

async function getNextQuote(){
  var shown=G.shownQuotes||[];
  var all=QUOTES.map(function(_,i){return i;}).filter(function(i){return shown.indexOf(i)<0;});
  if(all.length===0){shown=[];all=QUOTES.map(function(_,i){return i;});}
  var idx=all[Math.floor(Math.random()*all.length)];
  shown.push(idx);
  G.shownQuotes=shown;
  await sbWrite("portal-quotes-"+G.sid,shown);
  return QUOTES[idx];
}

function computeProgress(calData,book,diarioCount){
  var entrenos=0,pasos=0,comidas=0;
  Object.values(calData||{}).forEach(function(e){
    if(e.w)entrenos++;
    if(e.s)pasos++;
    if(e.m)comidas+=e.m.filter(function(x){return x;}).length;
  });
  var consecutive=0;
  var today=new Date();
  for(var d=0;d<365;d++){
    var dd=new Date(today);dd.setDate(dd.getDate()-d);
    var dk=dd.toISOString().slice(0,10);
    var entry=(calData||{})[dk];
    if(entry&&(entry.w||entry.s))consecutive++;
    else break;
  }
  var libros=0;
  if(book){
    libros=(book.history||[]).length;
    if(book.current)libros++;
  }
  return{entrenos:entrenos,pasos:pasos,comidas:comidas,racha:consecutive,libros:libros,diario:diarioCount||0};
}

function computeProgressBadgeKeys(calData,book,diarioCount){
  var p=computeProgress(calData,book,diarioCount);
  var CATS=[
    {key:"entrenos",count:p.entrenos,milestones:[1,5,10,25,50,100,200,365,500,1000]},
    {key:"pasos",count:p.pasos,milestones:[1,5,10,20,40,60,100,150,200,365]},
    {key:"comidas",count:p.comidas,milestones:[1,10,50,100,250,500,1000]},
    {key:"racha",count:p.racha,milestones:[3,7,14,21,30,60,90,180,365]},
    {key:"libros",count:p.libros,milestones:[1,3,5,10,20]},
    {key:"diario",count:p.diario,milestones:[1,7,14,30,60,100]}
  ];
  var earned={};
  CATS.forEach(function(cat){
    cat.milestones.forEach(function(m){
      if(cat.count>=m)earned[cat.key+"_"+m]=1;
    });
  });
  return earned;
}

async function checkAndSaveBadges(){
  var newEarned=computeProgressBadgeKeys(G.calData,G.book,G.diario.length);
  var prev=G.badges||{};
  var changed=false;
  var today=G.today;
  Object.keys(newEarned).forEach(function(k){
    if(!prev[k]){prev[k]=today;changed=true;}
  });
  if(changed){G.badges=prev;await sbWrite("portal-badges-"+G.sid,prev);}
}

async function updateRanking(){
  var days=Object.values(G.calData||{});
  var workouts=days.filter(function(d){return d.w;}).length;
  var steps=days.filter(function(d){return d.s;}).length;
  var me={sid:G.sid,name:G.st.name||G.sid,workouts:workouts,steps:steps,updated:G.today};
  var list=(G.ranking||[]).filter(function(r){return r.sid!==G.sid;});
  list.push(me);
  list.sort(function(a,b){return(b.workouts+b.steps)-(a.workouts+a.steps);});
  G.ranking=list;
  await sbWrite("portal-ranking",list);
  var el=document.getElementById("ranking-inner");if(el)el.innerHTML=buildRankingHtml();
}

function getTodayDiarioQ(){
  var d=new Date(G.today),start=new Date(d.getFullYear(),0,0);
  var diff=d-start,oneDay=1000*60*60*24;
  var doy=Math.floor(diff/oneDay);
  return PREGUNTAS_DIARIO[doy%PREGUNTAS_DIARIO.length];
}

  G.book.current=null;
  await sbWrite("portal-book-"+G.sid,G.book);
  var el=document.getElementById("book-inner");if(el)el.innerHTML=buildBookHtml();
}

    var q=await getNextQuote();
    showToast("INAMOVIBLE",q,"acc",false);
    sendBrowserNotif("INAMOVIBLE",q);
    shown.quote=1;
  }

  // Alerta: membresía por vencer o vencida
  if(!shown.pay&&st.nextPayDate){
    var np=new Date(st.nextPayDate),now=new Date();now.setHours(0,0,0,0);
    var diff=Math.round((np-now)/86400000);
    if(diff<0){
      showToast("MEMBRESÍA VENCIDA","Tu membresía venció hace "+Math.abs(diff)+" día"+(Math.abs(diff)>1?"s":"")+". Habla con tu coach.","alert",false);
      sendBrowserNotif("Membresía vencida","Tu membresía venció hace "+Math.abs(diff)+" días. Habla con tu coach.");
      shown.pay=1;
    }else if(diff<=5){
      showToast("MEMBRESÍA","Tu membresía vence en "+diff+" día"+(diff>1?"s":"")+". Renueva a tiempo.","warn",false);
      sendBrowserNotif("Membresía por vencer","Vence en "+diff+" días. Renueva a tiempo.");
      shown.pay=1;
    }
  }

  // Alerta: evaluación muy antigua (>35 días)
  if(!shown.eval&&ev&&ev.date){
    var evDate=new Date(ev.date);var daysSince=Math.floor((new Date()-evDate)/86400000);
    if(daysSince>35){
      showToast("EVALUACIÓN","Tu última evaluación fue hace "+daysSince+" días. Habla con tu coach para programar una nueva.","warn",false);
      sendBrowserNotif("Evaluación pendiente","Tu última evaluación fue hace "+daysSince+" días.");
      shown.eval=1;
    }
  }

  // Alerta: 5+ días sin marcar entrenamiento
  if(!shown.streak){
    var daysBack=0,daysNoWorkout=0;
    for(var d=0;d<7;d++){
      var dd=new Date(today);dd.setDate(dd.getDate()-d);
      var dk=dd.toISOString().slice(0,10);
      var entry=calData[dk];
      if(!entry||!entry.w)daysNoWorkout++;else break;
    }
    if(daysNoWorkout>=5){
      showToast("SIN REGISTROS","Llevas "+daysNoWorkout+" días sin marcar entrenamiento. ¿Todo bien?","warn",false);
      sendBrowserNotif("Sin registros","Llevas "+daysNoWorkout+" días sin marcar entrenamiento.");
      shown.streak=1;
    }
  }

  try{localStorage.setItem(lsKey,JSON.stringify(shown));}catch(e){}
}

document.getElementById("inp-pass").addEventListener("keydown",function(e){if(e.key==="Enter")doLogin();});
