<!doctype html>
<html>
<head>
<meta charset=utf8>
<meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mi Portal · Mis Espacios</title>
<link rel=stylesheet href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#07050F;--surf:#0D0920;--card:#130D27;--card2:#1A1235;--border:#231740;--border2:#2F1F56;
  --acc:#A855F7;--acc-d:rgba(168,85,247,.13);--acc-d2:rgba(168,85,247,.06);
  --txt:#EDE6FF;--txt2:#7A6A9E;--txt3:#3A2860;
  --grad:linear-gradient(135deg,#A855F7,#EC4899);
  --green:#34D399;--green-d:rgba(52,211,153,.12);
  --warn:#FBBF24;--warn-d:rgba(251,191,36,.12);
  --danger:#F87171;--danger-d:rgba(248,113,113,.12);
  color-scheme:dark
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh}
#login{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;position:relative;overflow:hidden}
#login::before{content:'';position:absolute;top:-100px;left:-100px;width:400px;height:400px;background:radial-gradient(circle,rgba(168,85,247,.12),transparent 70%);pointer-events:none}
#login::after{content:'';position:absolute;bottom:-80px;right:-60px;width:320px;height:320px;background:radial-gradient(circle,rgba(236,72,153,.08),transparent 70%);pointer-events:none}
.login-card{background:var(--card);border:1px solid var(--border2);border-radius:20px;padding:32px 28px;width:100%;max-width:360px;position:relative;z-index:1;box-shadow:0 24px 60px rgba(0,0,0,.4)}
.login-logo{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:28px;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;text-align:center;margin-bottom:4px}
.login-sub{font-size:12px;color:var(--txt2);text-align:center;margin-bottom:28px}
.fl{font-size:11px;font-weight:600;color:var(--txt2);text-transform:uppercase;letter-spacing:.7px;margin-bottom:6px;display:block}
.fi{width:100%;background:var(--surf);border:1px solid var(--border);color:var(--txt);border-radius:9px;padding:11px 14px;font-size:14px;font-family:'Inter',sans-serif;outline:none;transition:border-color .2s;margin-bottom:14px}
.fi:focus{border-color:var(--acc)}
.login-btn{width:100%;background:var(--grad);color:#fff;border:none;border-radius:9px;padding:13px;font-size:14px;font-weight:600;font-family:'Inter',sans-serif;cursor:pointer;margin-top:4px;transition:opacity .2s}
.login-btn:disabled{opacity:.6;cursor:default}
.login-err{color:var(--danger);font-size:12px;text-align:center;margin-top:10px;min-height:18px}
#app{display:none;flex-direction:column;min-height:100vh}
.app-header{background:var(--surf);border-bottom:1px solid var(--border);padding:12px 22px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10}
.app-logo{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:20px;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.app-name{font-size:13px;font-weight:600}
.app-obj{font-size:10px;color:var(--txt2)}
.logout-btn{background:none;border:1px solid var(--border);color:var(--txt2);font-size:11px;font-family:'Inter',sans-serif;font-weight:600;padding:5px 12px;border-radius:7px;cursor:pointer;flex-shrink:0}
.app-body{padding:16px 20px 40px;max-width:1100px;margin:0 auto;width:100%}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
@media(max-width:720px){.two-col{grid-template-columns:1fr}}
.col{display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border:1px solid var(--border);border-radius:13px;padding:16px}
.ct{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:15px;margin-bottom:12px;display:flex;align-items:center;gap:6px}
.badge{display:inline-flex;align-items:center;padding:2px 9px;border-radius:99px;font-size:10px;font-weight:600;line-height:1.4}
.bg{background:var(--green-d);color:var(--green)}
.bw{background:var(--warn-d);color:var(--warn)}
.bd{background:var(--danger-d);color:var(--danger)}
.ba{background:var(--acc-d);color:var(--acc)}
.section-lbl{font-size:10px;font-weight:600;color:var(--txt2);text-transform:uppercase;letter-spacing:.06em;margin-bottom:7px}
.section-date{font-size:10px;color:var(--txt2);margin-bottom:10px}
.divider{height:1px;background:var(--border);margin:12px 0}
/* INFO TOGGLE */
.info-toggle{background:none;border:none;color:var(--acc);font-size:11px;font-family:'Inter',sans-serif;cursor:pointer;padding:0;display:inline-flex;align-items:center;gap:4px;font-weight:500}
.info-box{background:var(--surf);border:1px solid var(--border);border-radius:9px;padding:12px;margin-top:8px;display:none}
.info-box.open{display:block}
.info-box table{width:100%;border-collapse:collapse;font-size:11px}
.info-box th{color:var(--txt2);font-weight:600;text-align:left;padding:4px 6px 4px 0;border-bottom:1px solid var(--border)}
.info-box td{padding:5px 6px 5px 0;border-bottom:1px solid var(--border);line-height:1.4;vertical-align:top}
.info-box tr:last-child td{border-bottom:none}
.info-box td:first-child{font-weight:600;white-space:nowrap;color:var(--acc);padding-right:10px}
/* IMC SCALE */
.imc-scale{margin:10px 0 8px}
.imc-bar{display:flex;height:8px;border-radius:99px;overflow:hidden;margin-bottom:6px}
.imc-label-row{display:flex;justify-content:space-between;font-size:9px;color:var(--txt2);position:relative;height:16px;align-items:flex-end}
.imc-needle-wrap{position:absolute;top:-16px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;pointer-events:none}
.imc-needle-arrow{font-size:8px;color:var(--txt);line-height:1}
.imc-needle-line{width:1px;height:12px;background:var(--txt)}
/* PLAN */
.week-list{display:flex;flex-direction:column;gap:6px}
.week-item{background:var(--surf);border:1px solid var(--border);border-radius:9px;padding:10px 13px;display:flex;align-items:center;gap:10px}
.week-item.cur{border-color:var(--acc);background:var(--acc-d2)}
.wnum{font-family:'Rajdhani',sans-serif;font-size:21px;font-weight:700;color:var(--txt3);width:28px;flex-shrink:0}
.week-item.cur .wnum{color:var(--acc)}
.winfo{flex:1;min-width:0}
.wtype{font-size:12px;font-weight:600}
.wdetail{font-size:10px;color:var(--txt2);margin-top:1px}
.wnow{font-size:10px;font-weight:700;color:var(--acc);background:var(--acc-d);padding:2px 8px;border-radius:99px;flex-shrink:0}
/* STATS */
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.stat-box{background:var(--surf);border:1px solid var(--border);border-radius:9px;padding:11px;text-align:center}
.stat-val{font-family:'Rajdhani',sans-serif;font-size:22px;font-weight:700;color:var(--acc);line-height:1}
.stat-lbl{font-size:9px;color:var(--txt2);text-transform:uppercase;letter-spacing:.5px;margin-top:3px}
/* RM */
.rm-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.rm-card{background:var(--surf);border:1px solid var(--border);border-radius:9px;padding:11px}
.rm-icon{font-size:18px;margin-bottom:4px}
.rm-name{font-size:10px;color:var(--txt2);margin-bottom:3px;line-height:1.3;min-height:26px}
.rm-val{font-family:'Rajdhani',sans-serif;font-size:20px;font-weight:700;color:var(--acc);line-height:1}
.rm-date{font-size:9px;color:var(--txt3);margin-top:2px}
/* CHECK BTN */
.check-btn{display:flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;border:2px solid var(--border2);background:transparent;cursor:pointer;color:var(--txt2);font-size:15px;transition:all .18s;flex-shrink:0}
.check-btn.done{border-color:var(--green);background:var(--green-d);color:var(--green)}
.check-btn:active{transform:scale(.9)}
/* TODAY */
.today-block{background:var(--surf);border:1px solid var(--border);border-radius:10px;padding:12px;display:flex;align-items:flex-start;gap:8px;transition:border-color .2s}
.today-block.done-block{border-color:var(--green);background:rgba(52,211,153,.07)}
.today-block-icon{font-size:22px;flex-shrink:0;margin-top:1px}
.today-block-info{flex:1;min-width:0}
.today-block-name{font-size:12px;font-weight:600}
.today-block-sub{font-size:10px;color:var(--txt2);margin-top:1px}
/* TIME PILLS */
.time-pills{display:flex;gap:5px;margin-top:6px;flex-wrap:wrap}
.time-pill{padding:4px 10px;border-radius:99px;font-size:10px;font-weight:600;cursor:pointer;border:1px solid var(--border2);background:transparent;color:var(--txt2);font-family:'Inter',sans-serif;transition:all .15s}
.time-pill.on{border-color:var(--acc);background:var(--acc-d);color:var(--acc)}
/* STEP GOAL */
.step-goal-row{display:flex;align-items:center;gap:7px;margin-top:7px}
.step-goal-inp{background:var(--card);border:1px solid var(--border);color:var(--txt);border-radius:7px;padding:5px 9px;font-size:12px;font-family:'Inter',sans-serif;width:90px;outline:none}
.step-goal-inp:focus{border-color:var(--acc)}
.step-save-btn{background:var(--acc-d);border:1px solid var(--acc);color:var(--acc);border-radius:7px;padding:5px 10px;font-size:11px;font-weight:600;font-family:'Inter',sans-serif;cursor:pointer}
.step-bar-wrap{margin-top:6px;background:var(--border);border-radius:99px;height:4px;overflow:hidden}
.step-bar-fill{height:100%;border-radius:99px;background:var(--warn)}
.edit-link{background:none;border:none;font-size:10px;color:var(--txt2);cursor:pointer;padding:4px 0 0;font-family:'Inter',sans-serif;text-decoration:underline}
/* MEAL */
.meal-row{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border)}
.meal-row:last-child{border-bottom:none}
.meal-info{flex:1;min-width:0}
.meal-name{font-size:12px;font-weight:600}
.meal-detail{font-size:10px;color:var(--txt2);margin-top:1px}
.meal-kcal{font-family:'Rajdhani',sans-serif;font-size:16px;font-weight:700;color:var(--warn);margin-right:8px}
/* MEAL COUNT SEL */
.meal-count-sel{display:flex;gap:5px}
.mcs-btn{flex:1;padding:5px 7px;background:var(--surf);border:1px solid var(--border);border-radius:7px;color:var(--txt2);font-size:11px;font-weight:600;cursor:pointer;text-align:center;transition:all .15s;font-family:'Inter',sans-serif}
.mcs-btn.on{background:var(--acc-d);border-color:var(--acc);color:var(--acc)}
/* MACROS */
.macro-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.macro-lbl{font-size:11px;font-weight:600;width:88px;flex-shrink:0}
.macro-bar{flex:1;height:5px;background:var(--border);border-radius:99px;overflow:hidden}
.macro-fill{height:100%;border-radius:99px}
.macro-val{font-size:10px;font-weight:600;width:70px;text-align:right;flex-shrink:0;color:var(--txt)}
.kcal-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.kcal-box{background:var(--surf);border-radius:9px;padding:10px;text-align:center}
.kcal-val{font-family:'Rajdhani',sans-serif;font-size:20px;font-weight:700}
.kcal-lbl{font-size:9px;color:var(--txt2);text-transform:uppercase;letter-spacing:.5px;margin-top:2px}
/* DISCLAIMER */
.disclaimer-box{background:var(--surf);border:1px solid var(--border2);border-radius:10px;padding:16px}
.disclaimer-title{font-size:13px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:6px;color:var(--warn)}
.disclaimer-list{list-style:none;padding:0;margin:0 0 14px}
.disclaimer-list li{font-size:11px;color:var(--txt2);padding:6px 0;border-bottom:1px solid var(--border);display:flex;gap:8px;line-height:1.5}
.disclaimer-list li:last-child{border-bottom:none}
.disclaimer-list li::before{content:'⚠';flex-shrink:0;color:var(--warn)}
.disclaimer-accept{width:100%;background:var(--grad);color:#fff;border:none;border-radius:9px;padding:11px;font-size:13px;font-weight:700;font-family:'Inter',sans-serif;cursor:pointer}
/* CALENDARIO */
.cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.cal-month{font-family:'Rajdhani',sans-serif;font-size:16px;font-weight:700}
.cal-nav{background:none;border:1px solid var(--border);color:var(--txt2);border-radius:6px;padding:4px 10px;cursor:pointer;font-size:12px;font-family:'Inter',sans-serif}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-dow{font-size:9px;font-weight:700;color:var(--txt3);text-align:center;padding:4px 0;text-transform:uppercase}
.cal-day{border-radius:8px;padding:5px 3px;min-height:52px;background:var(--surf);border:1px solid var(--border)}
.cal-day.today{border-color:var(--acc);background:var(--acc-d2)}
.cal-day.empty{background:transparent;border-color:transparent}
.cal-day.future{opacity:.35}
.cal-dn{font-size:10px;font-weight:700;color:var(--txt2);margin-bottom:3px}
.cal-day.today .cal-dn{color:var(--acc)}
.cal-dots{display:flex;gap:2px;flex-wrap:wrap}
.cal-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.dot-w{background:var(--acc)}
.dot-s{background:var(--warn)}
.dot-m{background:var(--green)}
.dot-empty{background:var(--border)}
/* MEMBRESÍA */
.mem-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border)}
.mem-row:last-child{border-bottom:none}
.mem-key{font-size:11px;color:var(--txt2)}
.mem-val{font-size:12px;font-weight:600}
/* UTILS */
.spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.2);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-wrap{display:flex;align-items:center;justify-content:center;padding:60px;gap:12px;color:var(--txt2);font-size:13px}
</style>
</head>
<body>

<div id="login">
  <div class="login-card">
    <div class="login-logo">Mis Espacios</div>
    <div class="login-sub">Portal del estudiante</div>
    <label class="fl">Usuario</label>
    <input class="fi" id="inp-user" placeholder="tu usuario" autocomplete="username" autocorrect="off" autocapitalize="off" spellcheck="false">
    <label class="fl">Contraseña</label>
    <input class="fi" id="inp-pass" type="password" placeholder="••••••••" autocomplete="current-password" style="margin-bottom:4px">
    <button class="login-btn" id="login-btn" onclick="doLogin()">Entrar</button>
    <div class="login-err" id="login-err"></div>
  </div>
</div>

<div id="app">
  <div class="app-header">
    <div class="app-logo">Mis Espacios</div>
    <div style="display:flex;align-items:center;gap:10px">
      <div><div class="app-name" id="app-stname"></div><div class="app-obj" id="app-stobj"></div></div>
      <button class="logout-btn" onclick="doLogout()">Salir</button>
    </div>
  </div>
  <div class="app-body" id="app-body">
    <div class="loading-wrap"><div class="spin"></div>Cargando...</div>
  </div>
</div>

<script>
var SB_URL="https://qnkaaiazuwkofbbhrtns.supabase.co";
var SB_KEY="sb_publishable_rS6hiZnNzUevos6Z8n9VDA_V6KSzj0u";
var SB_H={"apikey":SB_KEY,"Authorization":"Bearer "+SB_KEY,"Content-Type":"application/json"};
var LSK="misEsp_";
var G={sid:null,today:new Date().toISOString().slice(0,10),calData:{},mealCount:5,stepsGoal:8000,nutriOk:false,st:{},nutrition:{},plan:null,evals:[],att:[],calMonth:null};
var RM_EXERCISES=[
  {key:"squat",name:"Sentadilla",icon:"🏋️"},
  {key:"hipthrust",name:"Hip thrust",icon:"🍑"},
  {key:"bench",name:"Flexiones",icon:"💪",trackType:"reps"},
  {key:"ohp",name:"Press inclinado",icon:"🔝",womenName:"Plancha brazos ext.",womenTrackType:"time"},
  {key:"row",name:"Polea",icon:"🚣"},
  {key:"pulldown",name:"Dominadas",icon:"📌",trackType:"reps"}
];
var MESO_TYPES=[
  {key:"pr",label:"Fuerza / PR",icon:"💪",reps:"1–5 reps",pct:"85–100% 1RM"},
  {key:"hiper",label:"Hipertrofia",icon:"🏋️",reps:"6–12 reps",pct:"65–80% 1RM"},
  {key:"power",label:"Potencia",icon:"⚡",reps:"3–6 reps",pct:"75–85% 1RM"},
  {key:"deload",label:"Deload",icon:"🔄",reps:"15–20 reps",pct:"50–65% 1RM"}
];
var MEAL_NAMES={
  3:["Desayuno","Almuerzo","Cena"],
  4:["Desayuno","Almuerzo","Merienda","Cena"],
  5:["Desayuno","Media mañana","Almuerzo","Merienda","Cena"],
  6:["Desayuno","Media mañana","Almuerzo","Merienda","Cena","Colación"]
};
var MEAL_DIST={3:[30,35,35],4:[25,30,30,15],5:[20,25,30,15,10],6:[15,20,25,20,12,8]};
var TIME_OPTS=[
  {key:"M",label:"🌅 Mañana",range:"6am–12pm"},
  {key:"T",label:"☀️ Tarde",range:"12pm–6pm"},
  {key:"N",label:"🌙 Noche",range:"6pm–10pm"}
];

async function sha256(msg){
  var buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(msg));
  return Array.from(new Uint8Array(buf)).map(function(b){return b.toString(16).padStart(2,'0');}).join('');
}
async function fetchSbKey(key){
  var r=await fetch(SB_URL+"/rest/v1/app_data?key=eq."+encodeURIComponent(LSK+key)+"&select=value",{headers:SB_H});
  var d=await r.json();
  return(Array.isArray(d)&&d.length)?d[0].value:null;
}
async function sbWrite(key,value){
  try{
    await fetch(SB_URL+"/rest/v1/app_data",{
      method:"POST",
      headers:Object.assign({},SB_H,{"Prefer":"resolution=merge-duplicates"}),
      body:JSON.stringify({key:LSK+key,value:value,updated_at:new Date().toISOString()})
    });
  }catch(e){}
}
function fmtTime(s){var m=Math.floor((s||0)/60),sec=(s||0)%60;return m+":"+(sec<10?"0":"")+sec;}
function esc(s){return(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function showErr(msg){var e=document.getElementById("login-err");if(e)e.textContent=msg;}
function setLoading(on){var b=document.getElementById("login-btn");if(b){b.disabled=on;b.innerHTML=on?'<span class="spin"></span> Entrando...':'Entrar';}}
function todayEntry(){return G.calData[G.today]||(G.calData[G.today]={w:0,s:0,m:[]});}

async function doLogin(){
  var uname=(document.getElementById("inp-user").value||"").trim().toLowerCase();
  var pass=document.getElementById("inp-pass").value||"";
  showErr("");
  if(!uname||!pass){showErr("Completa usuario y contraseña");return;}
  setLoading(true);
  try{
    var portales=await fetchSbKey("portales");
    if(!Array.isArray(portales)){showErr("Error de conexión");setLoading(false);return;}
    var hash=await sha256(pass);
    var entry=portales.find(function(p){return p.username===uname&&p.pwdHash===hash;});
    if(!entry){showErr("Usuario o contraseña incorrectos");setLoading(false);return;}
    sessionStorage.setItem("portal_sid",entry.studentId);
    await loadDashboard(entry.studentId);
  }catch(e){showErr("Error de conexión");}
  setLoading(false);
}
function doLogout(){
  sessionStorage.removeItem("portal_sid");
  Object.assign(G,{sid:null,calData:{},mealCount:5,stepsGoal:8000,nutriOk:false,st:{},nutrition:{},plan:null,evals:[],att:[]});
  document.getElementById("login").style.display="flex";
  document.getElementById("app").style.display="none";
  document.getElementById("inp-pass").value="";
  showErr("");
}

async function loadDashboard(sid){
  G.sid=sid;
  if(!G.calMonth)G.calMonth=G.today.slice(0,7);
  document.getElementById("login").style.display="none";
  document.getElementById("app").style.display="flex";
  document.getElementById("app-body").innerHTML='<div class="loading-wrap"><div class="spin"></div>Cargando...</div>';
  try{
    var res=await Promise.all([
      fetchSbKey("students"),
      fetchSbKey("rm-"+sid),
      fetchSbKey("plan-"+sid),
      fetchSbKey("evals-"+sid),
      fetchSbKey("att-"+sid),
      fetchSbKey("nutrition-"+sid),
      fetchSbKey("portal-cal-"+sid),
      fetchSbKey("portal-meals-"+sid),
      fetchSbKey("portal-steps-"+sid),
      fetchSbKey("portal-nutri-ok-"+sid)
    ]);
    var students=res[0]||[],rms=res[1]||{};
    G.plan=res[2];G.evals=res[3]||[];G.att=res[4]||[];
    G.nutrition=res[5]||{};G.calData=res[6]||{};
    G.mealCount=res[7]||5;
    G.stepsGoal=res[8]||8000;
    G.nutriOk=res[9]===true;
    G.st=students.find(function(s){return s.id===sid;})||{};
    document.getElementById("app-stname").textContent=G.st.name||"Estudiante";
    document.getElementById("app-stobj").textContent=G.st.objective||"";
    renderDashboard(rms);

function calcMacros(){
  var st=G.st,ev=G.evals&&G.evals.length?G.evals[0]:null;
  var wkg=parseFloat((ev&&ev.weight)||st.weight)||70;
  var hcm=parseFloat(st.height)||170;
  var age=parseInt(st.age)||25,sex=st.sex||"M";
  var act=parseFloat((G.nutrition&&G.nutrition.activity)||"1.55");
  var goal=(G.nutrition&&G.nutrition.goal)||"mant";
  var tmb=sex==="M"?(10*wkg)+(6.25*hcm)-(5*age)+5:(10*wkg)+(6.25*hcm)-(5*age)-161;
  tmb=Math.round(tmb);
  var tdee=Math.round(tmb*act);
  var kcal=goal==="deficit"?tdee-300:goal==="superavit"?tdee+300:tdee;
  var pPct=sex==="M"?30:28,cPct=goal==="superavit"?45:goal==="deficit"?35:40,fPct=100-pPct-cPct;
  return{tmb:tmb,tdee:tdee,kcal:kcal,pPct:pPct,cPct:cPct,fPct:fPct,
    protG:Math.round((kcal*pPct/100)/4),carbG:Math.round((kcal*cPct/100)/4),fatG:Math.round((kcal*fPct/100)/9),
    wkg:wkg,act:act,goal:goal,hcm:hcm,age:age,sex:sex};
}

function buildMealsHtml(){
  var macro=calcMacros(),mc=G.mealCount,dist=MEAL_DIST[mc]||MEAL_DIST[5],names=MEAL_NAMES[mc]||MEAL_NAMES[5];
  var e=todayEntry();if(!e.m||e.m.length!==mc)e.m=Array(mc).fill(0);
  var html='';
  dist.forEach(function(pct,i){
    var pk=Math.round(macro.protG*pct/100),ck=Math.round(macro.carbG*pct/100),fk=Math.round(macro.fatG*pct/100),kc=Math.round(macro.kcal*pct/100);
    var done=e.m[i]?1:0;
    html+='<div class="meal-row"><div class="meal-info"><div class="meal-name">'+esc(names[i])+'</div><div class="meal-detail">P:'+pk+'g · C:'+ck+'g · G:'+fk+'g</div></div>'+

  });
  return html;
}

function buildImcScale(imc){
  if(!imc)return'';
  var pct=0;
  if(imc<=18.5)pct=(imc/18.5)*20;
  else if(imc<=25)pct=20+((imc-18.5)/6.5)*30;
  else if(imc<=30)pct=50+((imc-25)/5)*25;
  else pct=Math.min(75+((imc-30)/15)*23,97);
  pct=Math.max(1,Math.min(97,pct));
  var cls=imc<18.5?"bw":imc<25?"bg":imc<30?"bw":"bd";
  var lbl=imc<18.5?"Bajo peso":imc<25?"Normal":imc<30?"Sobrepeso":"Obesidad";
  return'<div style="margin:10px 0 8px">'+
    '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">'+
      '<span style="font-size:10px;color:var(--txt2)">Clasificación IMC · OMS</span>'+
      '<span class="badge '+cls+'">'+imc+' kg/m² · '+lbl+'</span>'+
    '</div>'+
    '<div style="position:relative;padding-bottom:18px">'+
      '<div style="display:flex;height:8px;border-radius:99px;overflow:hidden">'+
        '<div style="flex:18.5;background:#FBBF24;opacity:.5"></div>'+
        '<div style="flex:6.5;background:#34D399"></div>'+
        '<div style="flex:5;background:#FBBF24;opacity:.7"></div>'+
        '<div style="flex:10;background:#F87171"></div>'+
      '</div>'+
      '<div style="position:absolute;left:'+pct+'%;top:0;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center">'+
        '<div style="width:2px;height:8px;background:#fff;border-radius:1px"></div>'+
        '<div style="font-size:8px;color:#fff;font-weight:700;white-space:nowrap;background:rgba(0,0,0,.5);padding:1px 4px;border-radius:3px;margin-top:2px">Tú</div>'+
      '</div>'+
      '<div style="display:flex;justify-content:space-between;font-size:9px;color:var(--txt2);position:absolute;bottom:0;left:0;right:0">'+
        '<span>Bajo<br/>&lt;18.5</span>'+
        '<span style="text-align:center">Normal<br/>18.5–25</span>'+
        '<span style="text-align:center">Sobrepeso<br/>25–30</span>'+
        '<span style="text-align:right">Obesidad<br/>&gt;30</span>'+
      '</div>'+
    '</div>'+
  '</div>';
}

function buildDots(dateStr){
  var e=G.calData[dateStr]||{},mc=G.mealCount;
  var mDone=(e.m||[]).filter(function(x){return x;}).length===mc&&mc>0;
  var mAny=(e.m||[]).some(function(x){return x;});
  return'<div class="cal-dots">'+
    '<div class="cal-dot '+(e.w?"dot-w":"dot-empty")+'" title="Entrenamiento"></div>'+
    '<div class="cal-dot '+(e.s?"dot-s":"dot-empty")+'" title="Pasos"></div>'+
    '<div class="cal-dot '+(mDone?"dot-m":mAny?"dot-m":"dot-empty")+'" style="'+(mAny&&!mDone?"opacity:.45":"")+'" title="Comidas"></div>'+
  '</div>';
}
function buildCalendar(){
  var ym=G.calMonth,parts=ym.split("-"),yr=parseInt(parts[0]),mo=parseInt(parts[1])-1;
  var monthNames=["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
  var first=new Date(yr,mo,1),last=new Date(yr,mo+1,0),startDow=(first.getDay()+6)%7;
  var tp=G.today.split("-"),todayY=parseInt(tp[0]),todayM=parseInt(tp[1])-1,todayD=parseInt(tp[2]);
  var html='<div class="cal-header"><button class="cal-nav" onclick="calNav(-1)">‹</button><div class="cal-month">'+monthNames[mo]+' '+yr+'</div><button class="cal-nav" onclick="calNav(1)">›</button></div>';
  html+='<div class="cal-grid">';
  ["Lu","Ma","Mi","Ju","Vi","Sa","Do"].forEach(function(d){html+='<div class="cal-dow">'+d+'</div>';});
  for(var i=0;i<startDow;i++)html+='<div class="cal-day empty"></div>';
  for(var d=1;d<=last.getDate();d++){
    var dStr=yr+"-"+(mo+1<10?"0":"")+(mo+1)+"-"+(d<10?"0":"")+d;
    var isToday=(yr===todayY&&mo===todayM&&d===todayD);
    var isFuture=new Date(yr,mo,d)>new Date(todayY,todayM,todayD);
    html+='<div class="cal-day'+(isToday?" today":"")+(isFuture?" future":"")+'"><div class="cal-dn">'+d+'</div><div id="caldots-'+dStr+'">'+(!isFuture?buildDots(dStr):"")+'</div></div>';
  }
  html+='</div><div style="margin-top:10px;display:flex;gap:12px;font-size:10px;color:var(--txt2)">'+
    '<span><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--acc);margin-right:4px;vertical-align:middle"></span>Entreno</span>'+
    '<span><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--warn);margin-right:4px;vertical-align:middle"></span>Pasos</span>'+
    '<span><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);margin-right:4px;vertical-align:middle"></span>Comidas</span></div>';
  return html;
}
function calNav(dir){
  var parts=G.calMonth.split("-"),yr=parseInt(parts[0]),mo=parseInt(parts[1])-1;
  mo+=dir;if(mo<0){mo=11;yr--;}if(mo>11){mo=0;yr++;}
  G.calMonth=yr+"-"+(mo+1<10?"0":"")+(mo+1);
  var el=document.getElementById("calendar-inner");if(el)el.innerHTML=buildCalendar();
}

function renderDashboard(rms){
  var st=G.st,sex=st.sex||"M";
  var leftHtml="",rightHtml="";

  /* PLAN */
  var meso=null,curWeek=-1;
  if(G.plan&&Array.isArray(G.plan.mesociclos)&&G.plan.mesociclos.length){
    var idx=typeof G.plan.current==="number"?G.plan.current:0;
    meso=G.plan.mesociclos[idx]||G.plan.mesociclos[0];
    if(meso&&meso.start){var dp=Math.floor((Date.now()-new Date(meso.start))/(86400000));curWeek=Math.min(Math.max(Math.floor(dp/7),0),3);}
  }
  if(meso&&Array.isArray(meso.weeks)&&meso.weeks.length){
    leftHtml+='<div class="card"><div class="ct">📅 Mi plan actual</div><div class="week-list">';
    meso.weeks.forEach(function(w,i){
      var mt=MESO_TYPES.find(function(t){return t.key===w.type;})||{label:w.type||"Semana",icon:"📋",reps:"—",pct:"—"};
      var isCur=i===curWeek;
      leftHtml+='<div class="week-item'+(isCur?" cur":"")+'"><div class="wnum">S'+(i+1)+'</div>'+
        '<div class="winfo"><div class="wtype">'+mt.icon+' '+esc(mt.label)+'</div><div class="wdetail">'+esc(mt.reps)+' · '+esc(mt.pct)+'</div></div>'+
        (isCur?'<div class="wnow">Esta semana</div>':'')+
      '</div>';
    });
    leftHtml+='</div></div>';
  }

  /* ESTADÍSTICAS */
  var ev=G.evals&&G.evals.length?G.evals[0]:null;
  var wkg=parseFloat((ev&&ev.weight)||st.weight)||0;
  var hcm=parseFloat(st.height)||0;
  var imc=hcm>0?Math.round((wkg/((hcm/100)*(hcm/100)))*10)/10:null;
  var fat=ev&&ev.fat!=null?Number(ev.fat):null;
  var muscle=ev&&ev.muscle!=null?Number(ev.muscle):null;
  var masaGrasa=fat!=null&&wkg?Math.round(wkg*fat/100*10)/10:null;
  var masaMagra=masaGrasa!=null?Math.round((wkg-masaGrasa)*10)/10:null;
  var icc=ev&&ev.cin&&ev.cad?Math.round((ev.cin/ev.cad)*100)/100:null;
  var statsHtml='';
  if(ev&&ev.date)statsHtml+='<div class="section-date">Última evaluación: '+esc(ev.date)+'</div>';
  statsHtml+='<div class="section-lbl">Composición corporal</div><div class="stats-grid">';
  if(wkg)statsHtml+='<div class="stat-box"><div class="stat-val">'+wkg+'</div><div class="stat-lbl">Peso (kg)</div></div>';
  if(fat!=null)statsHtml+='<div class="stat-box"><div class="stat-val" style="color:var(--warn)">'+fat+'%</div><div class="stat-lbl">% Grasa</div></div>';
  if(muscle!=null)statsHtml+='<div class="stat-box"><div class="stat-val" style="color:var(--green)">'+muscle+'%</div><div class="stat-lbl">% Músculo</div></div>';
  if(masaGrasa!=null)statsHtml+='<div class="stat-box"><div class="stat-val" style="color:var(--warn)">'+masaGrasa+'</div><div class="stat-lbl">Masa grasa kg</div></div>';
  if(masaMagra!=null)statsHtml+='<div class="stat-box"><div class="stat-val" style="color:var(--green)">'+masaMagra+'</div><div class="stat-lbl">Masa magra kg</div></div>';
  if(imc!=null)statsHtml+='<div class="stat-box"><div class="stat-val">'+imc+'</div><div class="stat-lbl">IMC</div></div>';
  statsHtml+='</div>';
  if(imc)statsHtml+=buildImcScale(imc);
  if(icc){
    var iccSano=sex==="M"?icc<0.90:icc<0.85;
    statsHtml+='<span class="badge '+(iccSano?"bg":"bw")+'" style="margin-bottom:8px;display:inline-flex">ICC '+icc+' · '+(iccSano?"Bajo riesgo":"Riesgo moderado")+'</span>';
  }
  var MEDIDAS=[["Cintura",ev&&ev.cin],["Cadera",ev&&ev.cad],["Pecho",ev&&ev.pecho],["Bícep",ev&&ev.bicep],["Muslo",ev&&ev.muslo],["Glúteo",ev&&ev.glut],["Pantorrilla",ev&&ev.pant]].filter(function(m){return m[1]!=null&&m[1]!="";});
  if(MEDIDAS.length){
    statsHtml+='<div class="divider"></div><div class="section-lbl">Circunferencias (cm)</div><div class="stats-grid">';
    MEDIDAS.forEach(function(m){statsHtml+='<div class="stat-box"><div class="stat-val" style="font-size:18px">'+m[1]+'</div><div class="stat-lbl">'+esc(m[0])+'</div></div>';});
    statsHtml+='</div>';
  }
  statsHtml+='<button class="info-toggle" onclick="toggleInfo(\'inf-stats\')" style="margin-top:10px">ℹ️ ¿Qué significa cada medida?</button>'+
  '<div class="info-box" id="inf-stats"><table>'+
    '<tr><th>Medida</th><th>Qué es</th><th>Ref. saludable</th></tr>'+
    '<tr><td>IMC</td><td>Índice de Masa Corporal. Relación entre tu peso y tu estatura al cuadrado. Es una referencia general, no considera masa muscular.</td><td>18.5 – 24.9</td></tr>'+
    '<tr><td>ICC</td><td>Índice Cintura–Cadera. Indica dónde se almacena la grasa. Valores altos señalan mayor riesgo cardiovascular.</td><td>H: &lt;0.90 · M: &lt;0.85</td></tr>'+
    '<tr><td>% Grasa</td><td>Qué porcentaje de tu peso total es tejido graso. Alto = riesgo metabólico; muy bajo = puede afectar hormonas.</td><td>H: 10–20% · M: 20–30%</td></tr>'+
    '<tr><td>% Músculo</td><td>Qué porcentaje de tu peso es tejido muscular. A mayor músculo, mejor metabolismo en reposo.</td><td>H: 40–50% · M: 30–40%</td></tr>'+
    '<tr><td>Masa grasa</td><td>Los kilos totales de grasa que tiene tu cuerpo en este momento.</td><td>Depende del total</td></tr>'+
    '<tr><td>Masa magra</td><td>Todo lo que NO es grasa: músculo, huesos, agua, órganos. Cuanto mayor, mejor.</td><td>Cuanto más, mejor</td></tr>'+
    '<tr><td>Cintura</td><td>Circunferencia al nivel del ombligo. Indicador clave de grasa visceral (la más peligrosa).</td><td>H: &lt;94 cm · M: &lt;80 cm</td></tr>'+
  '</table></div>';
  leftHtml+='<div class="card"><div class="ct">📊 Estadísticas corporales</div>'+statsHtml+'</div>';

  /* RM */
  var rmCards="";
  RM_EXERCISES.forEach(function(ex){
    var effTrack=(sex==="F"&&ex.womenTrackType)?ex.womenTrackType:(ex.trackType||"weight");
    var effName=(sex==="F"&&ex.womenName)?ex.womenName:ex.name;
    var stored=(rms&&rms[ex.key])||{};
    if(stored.rm==null&&!stored.date)return;
    var val=stored.rm,valStr="—";
    if(val!=null){if(effTrack==="weight")valStr=val+" kg";else if(effTrack==="reps")valStr=val+" reps";else valStr=fmtTime(val);}
    var badge="";
    if(stored.isoDate){var dd=Math.floor((Date.now()-new Date(stored.isoDate))/(86400000));badge=dd>60?'<span class="badge bd">⚠ Vencido</span>':dd>45?'<span class="badge bw">⏳ Por vencer</span>':'<span class="badge bg">✓ Vigente</span>';}
    rmCards+='<div class="rm-card"><div class="rm-icon">'+ex.icon+'</div><div class="rm-name">'+esc(effName)+'</div><div class="rm-val">'+esc(valStr)+'</div>'+(stored.date?'<div class="rm-date">'+esc(stored.date)+'</div>':'')+(badge?'<div style="margin-top:5px">'+badge+'</div>':'')+'</div>';
  });
  if(rmCards)leftHtml+='<div class="card"><div class="ct">🏆 Marcas (RM)</div><div class="rm-grid">'+rmCards+'</div></div>';

  /* ══ DERECHA ══ */
  var te=todayEntry(),mc=G.mealCount;
  if(!te.m||te.m.length!==mc)te.m=Array(mc).fill(0);
  var dateLabel=new Date(G.today+'T12:00').toLocaleDateString("es-CR",{weekday:"long",day:"numeric",month:"long"});
  dateLabel=dateLabel.charAt(0).toUpperCase()+dateLabel.slice(1);

  /* HOY */
  var wtimePills=TIME_OPTS.map(function(t){return'<button id="wt-'+t.key+'" class="time-pill'+(te.wtime===t.key?" on":"")+'" onclick="setWtime(\''+t.key+'\')">'+t.label+'</button>';}).join("");
  var stepPct=te.s?100:0;
  rightHtml+='<div class="card"><div class="ct">✅ Hoy <span style="font-size:11px;font-weight:400;color:var(--txt2);margin-left:4px">'+dateLabel+'</span></div>'+
    '<div style="display:flex;flex-direction:column;gap:8px">'+
    '<div class="today-block'+(te.w?" done-block":"")+'" id="tb-workout">'+
      '<span class="today-block-icon">'+(te.w?"✅":"🏋️")+'</span>'+
      '<div class="today-block-info">'+
        '<div class="today-block-name">Entrenamiento</div>'+
        '<div class="today-block-sub">Sesión del día</div>'+
        '<div id="wtime-section" style="display:'+(te.w?"block":"none")+'">'+
          '<div style="font-size:9px;color:var(--txt2);margin-top:6px;margin-bottom:2px">¿En qué momento del día?</div>'+
          '<div class="time-pills">'+wtimePills+'</div>'+
        '</div>'+
      '</div>'+
      '<button class="check-btn'+(te.w?" done":"")+'" onclick="toggleWorkout()" style="margin-top:2px">'+(te.w?"✓":"○")+'</button>'+
    '</div>'+
    '<div class="today-block'+(te.s?" done-block":"")+'" id="tb-steps">'+
      '<span class="today-block-icon">'+(te.s?"✅":"👟")+'</span>'+
      '<div class="today-block-info">'+
        '<div class="today-block-name">Pasos</div>'+
        '<div id="step-goal-lbl" class="today-block-sub">Meta: '+G.stepsGoal.toLocaleString("es-CO")+' pasos</div>'+
        '<div class="step-bar-wrap"><div class="step-bar-fill" style="width:'+stepPct+'%"></div></div>'+
        '<div class="step-goal-row" id="step-edit-row" style="display:none">'+
          '<input class="step-goal-inp" id="step-goal-inp" type="number" min="1000" max="50000" step="500" placeholder="Pasos meta">'+
          '<button class="step-save-btn" onclick="saveStepGoal()">Guardar</button>'+
        '</div>'+
        '<button class="edit-link" onclick="showStepEdit()">✏️ Cambiar meta</button>'+
      '</div>'+
      '<button class="check-btn'+(te.s?" done":"")+'" onclick="toggleSteps()" style="margin-top:2px">'+(te.s?"✓":"○")+'</button>'+
    '</div>'+
    '</div></div>';

  /* NUTRICIÓN */
  rightHtml+='<div class="card"><div class="ct">🥗 Nutrición</div><div id="nutri-content">'+buildNutriHtml()+'</div></div>';

  /* CALENDARIO */
  rightHtml+='<div class="card"><div class="ct">📆 Calendario</div><div id="calendar-inner">'+buildCalendar()+'</div></div>';

  /* MEMBRESÍA */
  var payStatus=st.payStatus||"Pendiente";
  var payClass=payStatus==="Al dia"?"bg":payStatus==="Vencido"?"bd":"bw";
  var memHtml='<div class="mem-row"><span class="mem-key">Estado</span><span class="badge '+payClass+'">'+esc(payStatus)+'</span></div>';
  if(st.fee)memHtml+='<div class="mem-row"><span class="mem-key">Mensualidad</span><span class="mem-val">$'+(Number(st.fee)||0).toLocaleString("es-CO")+' COP</span></div>';
  if(st.payMode)memHtml+='<div class="mem-row"><span class="mem-key">Modalidad</span><span class="mem-val">'+esc(st.payMode)+'</span></div>';
  if(st.lastPayment)memHtml+='<div class="mem-row"><span class="mem-key">Último pago</span><span class="mem-val">'+esc(st.lastPayment)+'</span></div>';
  if(st.nextPayDate){
    var np=new Date(st.nextPayDate),t2=new Date();t2.setHours(0,0,0,0);
    var diff=Math.round((np-t2)/86400000);
    var diffCol=diff<0?"var(--danger)":diff<=5?"var(--warn)":"var(--green)";
    memHtml+='<div class="mem-row"><span class="mem-key">Próximo pago</span><span class="mem-val">'+esc(st.nextPayDate)+' <span style="color:'+diffCol+';font-size:10px">('+( diff===0?"Hoy":diff>0?"En "+diff+"d":"Hace "+Math.abs(diff)+"d")+')</span></span></div>';
  }
  if(st.months)memHtml+='<div class="mem-row"><span class="mem-key">Meses entrenando</span><span class="mem-val">'+st.months+'</span></div>';
  rightHtml+='<div class="card"><div class="ct">💳 Membresía</div>'+memHtml+'</div>';

  document.getElementById("app-body").innerHTML='<div class="two-col"><div class="col">'+leftHtml+'</div><div class="col">'+rightHtml+'</div></div>';
}

(function(){var sid=sessionStorage.getItem("portal_sid");if(sid)loadDashboard(sid);})();
document.getElementById("inp-user").addEventListener("keydown",function(e){if(e.key==="Enter")document.getElementById("inp-pass").focus();});
document.getElementById("inp-pass").addEventListener("keydown",function(e){if(e.key==="Enter")doLogin();});
</script>
</body>
</html>
