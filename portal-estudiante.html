<!doctype html>
<html>
<head>
<meta charset=utf8>
<meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mi Portal · INAMOVIBLE</title>
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="INAMOVIBLE">
<meta name="theme-color" content="#080808">
<link rel=stylesheet href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#080808;--surf:#111111;--card:#141414;--card2:#1A1A1A;--border:#242424;--border2:#2E2E2E;
  --acc:#C8102E;--acc-d:rgba(200,16,46,.14);--acc-d2:rgba(200,16,46,.07);
  --txt:#F2F2F2;--txt2:#777777;--txt3:#333333;
  --green:#34D399;--green-d:rgba(52,211,153,.12);
  --warn:#FBBF24;--warn-d:rgba(251,191,36,.12);
  --danger:#F87171;--danger-d:rgba(248,113,113,.12);
  color-scheme:dark
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh}
#login{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;position:relative;overflow:hidden}
#login::before{content:'';position:absolute;top:0;left:0;right:0;bottom:0;background:repeating-linear-gradient(0deg,transparent,transparent 39px,rgba(255,255,255,.018) 40px);pointer-events:none}
#login::after{content:'';position:absolute;bottom:0;left:0;right:0;height:2px;background:var(--acc)}
.login-card{background:var(--card);border:1px solid var(--border2);border-top:2px solid var(--acc);border-radius:4px;padding:36px 28px;width:100%;max-width:360px;position:relative;z-index:1}
.login-logo{font-family:'Oswald',sans-serif;font-weight:700;font-size:32px;color:var(--txt);letter-spacing:.08em;text-transform:uppercase;text-align:center;margin-bottom:2px}
.login-logo span{color:var(--acc)}
.login-sub{font-size:11px;color:var(--txt2);text-align:center;margin-bottom:28px;text-transform:uppercase;letter-spacing:.1em}
.fl{font-size:11px;font-weight:600;color:var(--txt2);text-transform:uppercase;letter-spacing:.7px;margin-bottom:6px;display:block}
.fi{width:100%;background:var(--surf);border:1px solid var(--border);color:var(--txt);border-radius:3px;padding:11px 14px;font-size:14px;font-family:'Inter',sans-serif;outline:none;transition:border-color .2s;margin-bottom:14px}
.fi:focus{border-color:var(--acc)}
.login-btn{width:100%;background:var(--acc);color:#fff;border:none;border-radius:3px;padding:13px;font-size:13px;font-weight:700;font-family:'Oswald',sans-serif;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;margin-top:4px;transition:opacity .2s}
.login-btn:disabled{opacity:.6;cursor:default}
.login-err{color:var(--danger);font-size:12px;text-align:center;margin-top:10px;min-height:18px}
#app{display:none;flex-direction:column;min-height:100vh}
.app-header{background:#000;border-bottom:1px solid var(--border);border-bottom-color:var(--acc);padding:11px 22px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10}
.app-logo{font-family:'Oswald',sans-serif;font-weight:700;font-size:19px;color:var(--txt);letter-spacing:.1em;text-transform:uppercase}
.app-logo span{color:var(--acc)}
.app-name{font-size:13px;font-weight:600}
.app-obj{font-size:10px;color:var(--txt2)}
.logout-btn{background:none;border:1px solid var(--border2);color:var(--txt2);font-size:10px;font-family:'Oswald',sans-serif;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:5px 12px;border-radius:2px;cursor:pointer;flex-shrink:0;transition:border-color .15s,color .15s}
.logout-btn:hover{border-color:var(--txt2);color:var(--txt)}
.app-body{padding:16px 20px 40px;max-width:1100px;margin:0 auto;width:100%}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
@media(max-width:720px){.two-col{grid-template-columns:1fr}}
.col{display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border:1px solid var(--border);border-radius:4px;padding:16px;border-top:1px solid var(--border2)}
.ct{font-family:'Oswald',sans-serif;font-weight:700;font-size:15px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:12px;display:flex;align-items:center;gap:6px}
.badge{display:inline-flex;align-items:center;padding:2px 9px;border-radius:99px;font-size:10px;font-weight:600;line-height:1.4}
.bg{background:var(--green-d);color:var(--green)}
.bw{background:var(--warn-d);color:var(--warn)}
.bd{background:var(--danger-d);color:var(--danger)}
.ba{background:var(--acc-d);color:var(--acc)}
.section-lbl{font-size:10px;font-weight:600;color:var(--txt2);text-transform:uppercase;letter-spacing:.06em;margin-bottom:7px}
.section-date{font-size:10px;color:var(--txt2);margin-bottom:10px}
.divider{height:1px;background:var(--border);margin:12px 0}
/* INFO TOGGLE */
.info-toggle{background:none;border:none;color:var(--acc);font-size:11px;font-family:'Inter',sans-serif;cursor:pointer;padding:0;display:inline-flex;align-items:center;gap:4px;font-weight:500}
.info-box{background:var(--surf);border:1px solid var(--border);border-radius:9px;padding:12px;margin-top:8px;display:none}
.info-box.open{display:block}
.info-box table{width:100%;border-collapse:collapse;font-size:11px}
.info-box th{color:var(--txt2);font-weight:600;text-align:left;padding:4px 6px 4px 0;border-bottom:1px solid var(--border)}
.info-box td{padding:5px 6px 5px 0;border-bottom:1px solid var(--border);line-height:1.4;vertical-align:top}
.info-box tr:last-child td{border-bottom:none}
.info-box td:first-child{font-weight:600;white-space:nowrap;color:var(--acc);padding-right:10px}
/* NOTIF BANNER */
.notif-banner{position:fixed;top:60px;right:14px;z-index:200;display:flex;flex-direction:column;gap:8px;max-width:320px;pointer-events:none}
.notif-toast{background:var(--card);border:1px solid var(--border2);border-left:3px solid var(--acc);border-radius:4px;padding:12px 14px;pointer-events:all;display:flex;gap:10px;align-items:flex-start;box-shadow:0 8px 32px rgba(0,0,0,.6);animation:notif-in .25s ease}
.notif-toast.nt-ok{border-left-color:var(--green)}
.notif-toast.nt-warn{border-left-color:var(--warn)}
.notif-toast.nt-alert{border-left-color:var(--danger)}
.notif-icon{flex-shrink:0;margin-top:1px;opacity:.9}
.notif-body{flex:1;min-width:0}
.notif-title{font-family:'Oswald',sans-serif;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--txt);margin-bottom:2px}
.notif-msg{font-size:11px;color:var(--txt2);line-height:1.4}
.notif-close{flex-shrink:0;background:none;border:none;color:var(--txt3);font-size:14px;cursor:pointer;padding:0;line-height:1;margin-top:-1px;transition:color .15s}
.notif-close:hover{color:var(--txt)}
@keyframes notif-in{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}
@media(max-width:480px){.notif-banner{left:10px;right:10px;max-width:100%}}
/* PROFILE */
.prof-row{display:flex;align-items:center;gap:14px}
.prof-avatar{width:52px;height:52px;border-radius:50%;background:#000;display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden}
.prof-name{font-family:'Oswald',sans-serif;font-size:17px;font-weight:700;letter-spacing:.06em}
.prof-obj{font-size:11px;color:var(--txt2);margin-top:2px}
.prof-meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.prof-tag{background:var(--surf);border:1px solid var(--border);border-radius:2px;padding:3px 8px;font-size:10px;color:var(--txt2)}
.prof-msg{font-size:10px;color:var(--txt3);margin-top:9px;font-style:italic}
/* NOTES */
.notes-list{display:flex;flex-direction:column;gap:6px;max-height:260px;overflow-y:auto;margin-bottom:8px}
.note-b{padding:8px 11px;border-radius:3px;font-size:11px;line-height:1.5}
.note-b.nc{background:var(--surf);border:1px solid var(--border);border-left:2px solid var(--acc)}
.note-b.ns{background:var(--acc-d2);border:1px solid var(--acc-d);border-left:2px solid var(--green)}
.note-meta{font-size:9px;color:var(--txt3);margin-top:3px}
.note-send-row{display:flex;gap:6px;margin-top:4px}
.note-inp{flex:1;background:var(--surf);border:1px solid var(--border);color:var(--txt);border-radius:3px;padding:8px 10px;font-size:12px;font-family:'Inter',sans-serif;outline:none;resize:none;min-height:36px}
.note-inp:focus{border-color:var(--acc)}
.note-send-btn{background:var(--acc);color:#fff;border:none;border-radius:3px;padding:0 14px;font-size:11px;font-weight:700;font-family:'Oswald',sans-serif;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
/* BADGES */
.badges-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.badge-item{background:var(--surf);border:1px solid var(--border);border-radius:3px;padding:9px 6px;text-align:center}
.badge-item.earned{border-color:var(--acc);background:var(--acc-d2)}
.badge-icon{font-size:20px;opacity:.2;display:block;margin-bottom:3px}
.badge-item.earned .badge-icon{opacity:1}
.badge-lbl{font-size:9px;color:var(--txt2);text-transform:uppercase;letter-spacing:.05em;line-height:1.3}
.badge-dt{font-size:8px;color:var(--acc);margin-top:2px}
/* RANKING */
.rank-row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--border)}
.rank-row:last-child{border-bottom:none}
.rank-num{font-family:'Oswald',sans-serif;font-size:17px;font-weight:700;color:var(--txt3);width:22px;flex-shrink:0;text-align:center}
.rank-name{flex:1;font-size:12px;font-weight:600}
.rank-pts{font-family:'Oswald',sans-serif;font-size:13px;color:var(--txt2)}
.rank-row.me .rank-num,.rank-row.me .rank-pts{color:var(--acc)}
.rank-row.me .rank-name{color:var(--txt)}
/* BOOK */
.book-prog-wrap{background:var(--border);border-radius:99px;height:5px;overflow:hidden;margin:7px 0 4px}
.book-prog-fill{height:100%;border-radius:99px;background:var(--acc)}
.book-page-row{display:flex;gap:6px;align-items:center;margin-top:6px}
.book-inp{background:var(--surf);border:1px solid var(--border);color:var(--txt);border-radius:3px;padding:5px 9px;font-size:12px;font-family:'Inter',sans-serif;width:80px;outline:none}
.book-inp:focus{border-color:var(--acc)}
.book-btn{background:var(--acc-d);border:1px solid var(--acc);color:var(--acc);border-radius:3px;padding:5px 10px;font-size:11px;font-weight:600;cursor:pointer}
.book-fin-btn{background:var(--green-d);border:1px solid var(--green);color:var(--green);border-radius:3px;padding:5px 10px;font-size:11px;font-weight:600;cursor:pointer}
.book-add-row{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.book-add-inp{background:var(--surf);border:1px solid var(--border);color:var(--txt);border-radius:3px;padding:8px 10px;font-size:12px;font-family:'Inter',sans-serif;outline:none}
.book-add-inp:focus{border-color:var(--acc)}
.book-add-inp::placeholder,.book-inp::placeholder{color:var(--txt2);opacity:1}
.book-start-btn{background:var(--acc);color:#fff;border:none;border-radius:3px;padding:9px;font-size:11px;font-weight:700;font-family:'Oswald',sans-serif;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
.book-hist{margin-top:8px;font-size:10px;color:var(--txt2)}
.book-hist-item{padding:4px 0;border-bottom:1px solid var(--border)}
.book-hist-item:last-child{border-bottom:none}
/* MONTH STEPS */
.msteps-lbl{font-size:10px;margin-top:6px}
/* IMC SCALE */
.imc-scale{margin:10px 0 8px}
.imc-bar{display:flex;height:8px;border-radius:99px;overflow:hidden;margin-bottom:6px}
.imc-label-row{display:flex;justify-content:space-between;font-size:9px;color:var(--txt2);position:relative;height:16px;align-items:flex-end}
.imc-needle-wrap{position:absolute;top:-16px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;pointer-events:none}
.imc-needle-arrow{font-size:8px;color:var(--txt);line-height:1}
.imc-needle-line{width:1px;height:12px;background:var(--txt)}
/* PLAN */
.week-list{display:flex;flex-direction:column;gap:6px}
.week-item{background:var(--surf);border:1px solid var(--border);border-radius:3px;padding:10px 13px;display:flex;align-items:center;gap:10px}
.week-item.cur{border-color:var(--acc);border-left:3px solid var(--acc);background:var(--acc-d2)}
.wnum{font-family:'Oswald',sans-serif;font-size:22px;font-weight:700;color:var(--txt3);width:30px;flex-shrink:0;letter-spacing:.04em}
.week-item.cur .wnum{color:var(--acc)}
.winfo{flex:1;min-width:0}
.wtype{font-size:12px;font-weight:600}
.wdetail{font-size:10px;color:var(--txt2);margin-top:1px}
.wnow{font-size:10px;font-weight:700;color:var(--acc);background:var(--acc-d);padding:2px 8px;border-radius:2px;flex-shrink:0;text-transform:uppercase;letter-spacing:.06em;font-family:'Oswald',sans-serif}
/* METRIC CARDS */
.metric-scroll{display:flex;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px;margin-bottom:10px;scrollbar-width:none}
.metric-scroll::-webkit-scrollbar{display:none}
.metric-card{background:var(--surf);border:1px solid var(--border);border-top:2px solid var(--border2);border-radius:3px;padding:14px 13px;min-width:148px;flex-shrink:0;display:flex;flex-direction:column;gap:3px}
.metric-card-lbl{font-size:9px;font-weight:700;color:var(--txt2);text-transform:uppercase;letter-spacing:.1em;font-family:'Oswald',sans-serif}
.metric-card-val{font-family:'Oswald',sans-serif;font-size:32px;font-weight:700;color:var(--txt);line-height:1;margin:4px 0 2px}
.metric-card-unit{font-size:10px;color:var(--txt2);font-weight:500;letter-spacing:.04em}
.metric-card-desc{font-size:10px;color:var(--txt2);line-height:1.4;margin-top:4px}
/* STATS GRID (circunferencias) */
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}
.stat-box{background:var(--surf);border:1px solid var(--border);border-radius:3px;padding:11px;text-align:center}
.stat-val{font-family:'Oswald',sans-serif;font-size:24px;font-weight:700;color:var(--txt);line-height:1}
.stat-lbl{font-size:9px;color:var(--txt2);text-transform:uppercase;letter-spacing:.06em;margin-top:3px}
/* RM */
.rm-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.rm-card{background:var(--surf);border:1px solid var(--border);border-left:2px solid var(--border2);border-radius:3px;padding:11px}
.rm-icon{font-size:16px;margin-bottom:4px}
.rm-name{font-size:10px;color:var(--txt2);margin-bottom:3px;line-height:1.3;min-height:26px;text-transform:uppercase;letter-spacing:.04em}
.rm-val{font-family:'Oswald',sans-serif;font-size:22px;font-weight:700;color:var(--txt);line-height:1}
.rm-date{font-size:9px;color:var(--txt3);margin-top:2px}
/* CHECK BTN */
.check-btn{display:flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;border:2px solid var(--border2);background:transparent;cursor:pointer;color:var(--txt2);font-size:15px;transition:all .18s;flex-shrink:0}
.check-btn.done{border-color:var(--acc);background:var(--acc-d);color:var(--acc)}
.check-btn:active{transform:scale(.9)}
/* TODAY */
.today-block{background:var(--surf);border:1px solid var(--border);border-left:3px solid var(--border2);border-radius:3px;padding:12px;display:flex;align-items:flex-start;gap:8px;transition:border-color .2s}
.today-block.done-block{border-left-color:var(--acc);background:var(--acc-d2)}
.today-block-icon{font-size:22px;flex-shrink:0;margin-top:1px}
.today-block-info{flex:1;min-width:0}
.today-block-name{font-size:12px;font-weight:600}
.today-block-sub{font-size:10px;color:var(--txt2);margin-top:1px}
/* TIME PILLS */
.time-pills{display:flex;gap:5px;margin-top:6px;flex-wrap:wrap}
.time-pill{padding:4px 10px;border-radius:99px;font-size:10px;font-weight:600;cursor:pointer;border:1px solid var(--border2);background:transparent;color:var(--txt2);font-family:'Inter',sans-serif;transition:all .15s}
.time-pill{padding:4px 10px;border-radius:2px;font-size:10px;font-weight:600;cursor:pointer;border:1px solid var(--border2);background:transparent;color:var(--txt2);font-family:'Oswald',sans-serif;letter-spacing:.06em;text-transform:uppercase;transition:all .15s}
.time-pill.on{border-color:var(--acc);background:var(--acc-d);color:var(--acc)}
/* STEP GOAL */
.step-goal-row{display:flex;align-items:center;gap:7px;margin-top:7px}
.step-goal-inp{background:var(--card);border:1px solid var(--border);color:var(--txt);border-radius:7px;padding:5px 9px;font-size:12px;font-family:'Inter',sans-serif;width:90px;outline:none}
.step-goal-inp:focus{border-color:var(--acc)}
.step-save-btn{background:var(--acc-d);border:1px solid var(--acc);color:var(--acc);border-radius:7px;padding:5px 10px;font-size:11px;font-weight:600;font-family:'Inter',sans-serif;cursor:pointer}
.step-bar-wrap{margin-top:6px;background:var(--border);border-radius:99px;height:4px;overflow:hidden}
.step-bar-fill{height:100%;border-radius:99px;background:var(--warn)}
.edit-link{background:none;border:none;font-size:10px;color:var(--txt2);cursor:pointer;padding:4px 0 0;font-family:'Inter',sans-serif;text-decoration:underline}
/* MEAL */
.meal-row{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border)}
.meal-row:last-child{border-bottom:none}
.meal-info{flex:1;min-width:0}
.meal-name{font-size:12px;font-weight:600}
.meal-detail{font-size:10px;color:var(--txt2);margin-top:1px}
.meal-kcal{font-family:'Oswald',sans-serif;font-size:16px;font-weight:700;color:var(--warn);margin-right:8px}
/* MEAL COUNT SEL */
.meal-count-sel{display:flex;gap:5px}
.mcs-btn{flex:1;padding:5px 7px;background:var(--surf);border:1px solid var(--border);border-radius:7px;color:var(--txt2);font-size:11px;font-weight:600;cursor:pointer;text-align:center;transition:all .15s;font-family:'Inter',sans-serif}
.mcs-btn.on{background:var(--acc-d);border-color:var(--acc);color:var(--acc)}
/* CAL TODAY */
.cal-day.today{border-color:var(--acc);background:var(--acc-d2)!important}
.cal-day.today .cal-dn{color:var(--acc)}
/* MACROS */
.macro-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.macro-lbl{font-size:11px;font-weight:600;width:88px;flex-shrink:0}
.macro-bar{flex:1;height:5px;background:var(--border);border-radius:99px;overflow:hidden}
.macro-fill{height:100%;border-radius:99px}
.macro-val{font-size:10px;font-weight:600;width:70px;text-align:right;flex-shrink:0;color:var(--txt)}
.kcal-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.kcal-box{background:var(--surf);border-radius:9px;padding:10px;text-align:center}
.kcal-val{font-family:'Oswald',sans-serif;font-size:20px;font-weight:700}
.kcal-lbl{font-size:9px;color:var(--txt2);text-transform:uppercase;letter-spacing:.5px;margin-top:2px}
/* DISCLAIMER */
.disclaimer-box{background:var(--surf);border:1px solid var(--border2);border-radius:10px;padding:16px}
.disclaimer-title{font-size:13px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:6px;color:var(--warn)}
.disclaimer-list{list-style:none;padding:0;margin:0 0 14px}
.disclaimer-list li{font-size:11px;color:var(--txt2);padding:6px 0;border-bottom:1px solid var(--border);display:flex;gap:8px;line-height:1.5}
.disclaimer-list li:last-child{border-bottom:none}
.disclaimer-list li::before{content:'⚠';flex-shrink:0;color:var(--warn)}
.disclaimer-accept{width:100%;background:var(--acc);color:#fff;border:none;border-radius:2px;padding:12px;font-size:12px;font-weight:700;font-family:'Oswald',sans-serif;letter-spacing:.12em;text-transform:uppercase;cursor:pointer}
/* CALENDARIO */
.cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.cal-month{font-family:'Oswald',sans-serif;font-size:16px;font-weight:700}
.cal-nav{background:none;border:1px solid var(--border);color:var(--txt2);border-radius:6px;padding:4px 10px;cursor:pointer;font-size:12px;font-family:'Inter',sans-serif}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-dow{font-size:9px;font-weight:700;color:var(--txt3);text-align:center;padding:4px 0;text-transform:uppercase}
.cal-day{border-radius:2px;padding:5px 3px;min-height:52px;background:var(--surf);border:1px solid var(--border)}
.cal-day.empty{background:transparent;border-color:transparent}
.cal-day.future{opacity:.3}
.cal-dn{font-size:10px;font-weight:700;color:var(--txt2);margin-bottom:3px;font-family:'Oswald',sans-serif;letter-spacing:.04em}
.cal-dots{display:flex;gap:2px;flex-wrap:wrap}
.cal-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.dot-w{background:var(--acc)}
.dot-s{background:var(--warn)}
.dot-m{background:var(--green)}
.dot-empty{background:var(--border)}
/* MEMBRESÍA */
.mem-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border)}
.mem-row:last-child{border-bottom:none}
.mem-key{font-size:11px;color:var(--txt2)}
.mem-val{font-size:12px;font-weight:600}
/* UTILS */
.spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.2);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-wrap{display:flex;align-items:center;justify-content:center;padding:60px;gap:12px;color:var(--txt2);font-size:13px}
/* MOBILE */
@media(max-width:600px){
  .app-header{padding:10px 14px;gap:8px}
  .app-logo{font-size:17px}
  .app-name{font-size:12px}
  .app-obj{font-size:9px}
  .logout-btn{padding:4px 9px;font-size:10px}
  .app-body{padding:10px 11px 32px}
  .card{padding:13px 12px}
  .ct{font-size:14px;margin-bottom:10px}
  .metric-card{min-width:130px;padding:11px 10px}
  .metric-card-val{font-size:24px}
  .metric-card-desc{font-size:9px}
  .stats-grid{grid-template-columns:repeat(2,1fr);gap:6px}
  .kcal-row{gap:6px}
  .kcal-box{padding:8px 6px}
  .kcal-val{font-size:16px}
  .cal-grid{gap:2px}
  .cal-day{min-height:44px;padding:4px 2px}
  .cal-dn{font-size:9px}
  .cal-dot{width:6px;height:6px}
  .today-block{padding:10px}
  .today-block-icon{font-size:18px}
  .rm-grid{grid-template-columns:1fr 1fr}
  .week-item{padding:8px 10px;gap:8px}
  .wnum{font-size:18px;width:24px}
  .meal-count-sel{gap:4px}
  .mcs-btn{padding:4px 5px;font-size:10px}
  .macro-lbl{width:76px;font-size:10px}
  .macro-val{font-size:9px;width:60px}
  .time-pills{gap:4px}
  .time-pill{padding:3px 8px;font-size:9px}
  .info-box table{font-size:10px}
  .info-box td,.info-box th{padding:4px 4px 4px 0}
  .disclaimer-list li{font-size:10px}
}
/* PROGRESO */
.progreso-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(max-width:480px){.progreso-grid{grid-template-columns:1fr}}
.progreso-card{background:var(--surf);border:1px solid var(--border);border-radius:4px;padding:12px 14px}
.progreso-card-done{border-color:var(--acc)}
.progreso-card-label{font-family:'Oswald',sans-serif;font-size:10px;font-weight:700;letter-spacing:.12em;color:var(--txt2);text-transform:uppercase;margin-bottom:4px}
.progreso-card-top{display:flex;align-items:flex-end;justify-content:space-between;gap:6px}
.progreso-card-count{font-family:'Oswald',sans-serif;font-weight:700;font-size:34px;color:var(--txt);line-height:1}
.progreso-card-pct{font-family:'Oswald',sans-serif;font-weight:700;font-size:18px;color:var(--txt2);line-height:1;padding-bottom:2px}
.progreso-card-pct-done{color:var(--acc)}
.progreso-card-meta{font-size:10px;color:var(--txt2);margin-top:4px;text-transform:lowercase}
.progreso-bar{height:3px;background:var(--border);border-radius:2px;margin-top:10px}
.progreso-bar-fill{height:100%;background:var(--acc);border-radius:2px;transition:width .4s}
.progreso-card-date{font-size:9px;color:var(--txt3);margin-top:5px}
.logro-date{font-size:10px;color:var(--txt2)}
.racha-display{font-size:12px;color:var(--txt2);margin-bottom:10px;padding:8px 0;border-bottom:1px solid var(--border)}
.racha-num{font-family:'Oswald',sans-serif;font-weight:700;font-size:20px;color:var(--txt)}
/* DIARIO */
.diario-tema{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--acc);margin-bottom:6px}
.diario-q{font-size:13px;font-weight:600;line-height:1.5;margin-bottom:10px;color:var(--txt)}
.diario-inp{width:100%;background:var(--surf);border:1px solid var(--border);color:var(--txt);border-radius:3px;padding:10px;font-size:12px;font-family:'Inter',sans-serif;outline:none;resize:vertical;min-height:70px}
.diario-inp:focus{border-color:var(--acc)}
.diario-inp::placeholder{color:var(--txt2);opacity:1}
.diario-lbl{font-size:10px;font-weight:600;color:var(--txt2);text-transform:uppercase;letter-spacing:.06em;margin-top:10px;margin-bottom:5px;display:block}
.diario-btn{background:var(--acc);color:#fff;border:none;border-radius:3px;padding:9px 16px;font-size:11px;font-weight:700;font-family:'Oswald',sans-serif;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;margin-top:8px}
/* LA ROCA */
.roca-cita{font-size:10px;color:var(--txt2);font-style:italic;margin-bottom:12px;padding-left:10px;border-left:2px solid var(--acc);line-height:1.6}
.roca-inp{width:100%;background:var(--surf);border:1px solid var(--border);color:var(--txt);border-radius:3px;padding:10px;font-size:12px;font-family:'Inter',sans-serif;outline:none;resize:vertical;min-height:70px;margin-bottom:8px}
.roca-inp:focus{border-color:var(--acc)}
.roca-inp::placeholder{color:var(--txt2);opacity:1}
.roca-hist-item{padding:8px 10px;background:var(--surf);border:1px solid var(--border);border-radius:3px;margin-bottom:6px;font-size:11px;line-height:1.5}
.roca-hist-date{font-size:9px;color:var(--txt3);margin-top:4px}
/* MODAL FRASE */
.quote-modal{position:fixed;inset:0;background:rgba(0,0,0,.88);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);z-index:1000;display:flex;align-items:center;justify-content:center;padding:24px;opacity:0;transition:opacity .3s}
.quote-modal.visible{opacity:1}
.quote-box{background:var(--card);border:1px solid var(--border2);border-top:2px solid var(--acc);border-radius:4px;padding:32px 28px;max-width:400px;width:100%;text-align:center}
.quote-day{font-size:10px;color:var(--txt2);text-transform:uppercase;letter-spacing:.12em;margin-bottom:20px}
.quote-text{font-family:'Oswald',sans-serif;font-size:22px;font-weight:500;line-height:1.45;color:var(--txt);margin-bottom:24px}
.quote-close{background:var(--acc);color:#fff;border:none;border-radius:3px;padding:11px 28px;font-size:12px;font-weight:700;font-family:'Oswald',sans-serif;letter-spacing:.12em;text-transform:uppercase;cursor:pointer}
/* FOTOS */
.foto-upload-btn{display:flex;align-items:center;gap:8px;background:var(--surf);border:1px dashed var(--border2);color:var(--txt2);border-radius:3px;padding:12px;width:100%;font-size:12px;font-family:'Inter',sans-serif;cursor:pointer;text-align:left;margin-bottom:12px;transition:border-color .2s}
.foto-upload-btn:hover{border-color:var(--acc);color:var(--txt)}
.foto-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.foto-item{position:relative;aspect-ratio:3/4;border-radius:3px;overflow:hidden;background:var(--surf)}
.foto-item img{width:100%;height:100%;object-fit:cover;display:block}
.foto-date{position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.7);font-size:9px;color:#fff;padding:3px 5px;font-family:'Oswald',sans-serif;letter-spacing:.04em}
.foto-del{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.6);border:none;color:#fff;border-radius:50%;width:18px;height:18px;font-size:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1}
.foto-empty{font-size:11px;color:var(--txt3);text-align:center;padding:20px 0}
/* REGISTRO */
.login-toggle{font-size:11px;color:var(--txt2);text-align:center;margin-top:14px}
.login-toggle a{color:var(--acc);cursor:pointer;text-decoration:none;font-weight:600}
.reg-card{display:none}
/* CAL NOTA */
.cal-note-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0}
.dot-note-ap{background:var(--txt2)}
.dot-note-pend{background:var(--acc)}
.cal-day.cal-selected{border-color:var(--acc)!important;background:var(--acc-d)!important}
.cal-day.cal-selected .cal-dn{color:var(--acc)}
.cal-note-inp{width:100%;background:var(--surf);border:1px solid var(--border);color:var(--txt);border-radius:3px;padding:8px 10px;font-size:11px;font-family:'Inter',sans-serif;outline:none;resize:none;min-height:56px;margin-top:8px}
.cal-note-inp::placeholder{color:var(--txt2);opacity:1}
.cal-note-inp:focus{border-color:var(--acc)}
.cal-note-btn{background:var(--acc);color:#fff;border:none;border-radius:2px;padding:5px 12px;font-size:10px;font-weight:700;font-family:'Oswald',sans-serif;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;margin-top:5px}
.day-note-modal{position:fixed;inset:0;background:rgba(0,0,0,.8);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:900;display:none;align-items:center;justify-content:center;padding:20px}
.day-note-modal.open{display:flex}
.day-note-box{background:var(--card);border:1px solid var(--border2);border-radius:4px;padding:20px;max-width:360px;width:100%}
.day-note-title{font-family:'Oswald',sans-serif;font-size:14px;font-weight:700;letter-spacing:.06em;margin-bottom:12px}
.day-note-footer{display:flex;gap:8px;margin-top:8px}
.day-note-cancel{background:none;border:1px solid var(--border2);color:var(--txt2);border-radius:2px;padding:7px 14px;font-size:10px;font-family:'Oswald',sans-serif;font-weight:600;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;flex:1}
.day-note-save{background:var(--acc);color:#fff;border:none;border-radius:2px;padding:7px 14px;font-size:10px;font-family:'Oswald',sans-serif;font-weight:700;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;flex:1}
/* HOY RESUMEN */
.hoy-sum-grid{display:flex;gap:8px;margin-bottom:8px}
.hoy-sum-item{flex:1;text-align:center;padding:8px 4px;border-radius:6px;border:1px solid var(--border)}
.hoy-sum-item.done{border-color:var(--acc);background:var(--acc-d)}
.hoy-sum-ico{font-size:17px;line-height:1}
.hoy-sum-lbl{font-size:9px;color:var(--txt2);margin-top:2px;text-transform:uppercase;letter-spacing:.05em}
.hoy-sum-racha{font-family:'Oswald',sans-serif;font-size:20px;font-weight:700;color:var(--acc);line-height:1}
.hoy-meta-preview{font-size:11px;color:var(--txt2);border-top:1px solid var(--border);padding-top:7px;margin-top:6px;line-height:1.5}
/* EVAL ALERT */
.eval-alert-inline{display:flex;align-items:center;gap:7px;background:rgba(200,16,46,.08);border:1px solid rgba(200,16,46,.25);border-radius:5px;padding:8px 10px;font-size:11px;color:#ff6060;margin-top:8px;line-height:1.4}
/* ONBOARDING */
.onboard-card{background:rgba(200,16,46,.05);border:1px solid var(--border2);border-radius:8px;padding:14px;margin-bottom:14px}
.onboard-title{font-family:'Oswald',sans-serif;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--txt2);margin-bottom:10px}
.onboard-step{display:flex;align-items:center;gap:10px;padding:5px 0;font-size:12px;color:var(--txt)}
.onboard-step-ico{width:20px;height:20px;border-radius:50%;border:2px solid var(--border2);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0;color:var(--txt3)}
.onboard-step.done .onboard-step-ico{background:var(--acc);border-color:var(--acc);color:#fff}
.onboard-step.done{color:var(--txt2);text-decoration:line-through}
/* PERFIL EDIT */
.prof-edit-btn{background:none;border:1px solid var(--border2);color:var(--txt2);border-radius:2px;padding:4px 10px;font-size:10px;font-family:'Oswald',sans-serif;font-weight:600;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;margin-top:8px;transition:border-color .2s}
.prof-edit-btn:hover{border-color:var(--acc);color:var(--txt)}
.prof-edit-form{margin-top:10px;display:flex;flex-direction:column;gap:6px}
.prof-edit-inp{background:var(--surf);border:1px solid var(--border);color:var(--txt);border-radius:3px;padding:7px 10px;font-size:12px;font-family:'Inter',sans-serif;outline:none}
.prof-edit-inp:focus{border-color:var(--acc)}
.prof-edit-row{display:flex;gap:6px}
.prof-save-btn{background:var(--acc);color:#fff;border:none;border-radius:2px;padding:7px 0;font-size:10px;font-family:'Oswald',sans-serif;font-weight:700;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;flex:1}
.prof-cancel-btn{background:none;border:1px solid var(--border2);color:var(--txt2);border-radius:2px;padding:7px 0;font-size:10px;font-family:'Oswald',sans-serif;font-weight:600;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;flex:1}
/* MI SIGUIENTE PASO */
.meta-type-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.meta-type-btn{background:var(--surf);border:1px solid var(--border);border-radius:3px;padding:10px 8px;cursor:pointer;text-align:center;transition:border-color .2s,background .2s}
.meta-type-btn:hover,.meta-type-btn.sel{border-color:var(--acc);background:var(--acc-d)}
.meta-type-icon{font-size:20px;margin-bottom:4px;line-height:1}
.meta-type-lbl{font-family:'Oswald',sans-serif;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--txt)}
.meta-nivel-row{display:flex;gap:6px;margin-bottom:12px}
.meta-nivel-btn{flex:1;border:1px solid var(--border);border-radius:3px;padding:6px 4px;text-align:center;cursor:pointer;background:var(--surf);font-size:10px;font-family:'Oswald',sans-serif;font-weight:600;letter-spacing:.05em;text-transform:uppercase;transition:border-color .2s}
.meta-nivel-btn:hover,.meta-nivel-btn.sel{border-color:var(--acc);background:var(--acc-d);color:var(--txt)}
.meta-inp{background:var(--surf);border:1px solid var(--border);color:var(--txt);border-radius:3px;padding:8px 10px;font-size:12px;font-family:'Inter',sans-serif;outline:none;width:100%;margin-bottom:8px;box-sizing:border-box}
.meta-inp:focus{border-color:var(--acc)}
.meta-start-btn{background:var(--acc);color:#fff;border:none;border-radius:2px;padding:9px 0;font-size:11px;font-family:'Oswald',sans-serif;font-weight:700;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;width:100%}
.meta-progress{margin-bottom:10px}
.meta-prog-bar{background:var(--border);border-radius:2px;height:4px;margin-top:4px}
.meta-prog-fill{background:var(--acc);border-radius:2px;height:4px;transition:width .4s}
.meta-week-list{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.meta-week-item{display:flex;align-items:flex-start;gap:8px;padding:8px 10px;background:var(--surf);border:1px solid var(--border);border-radius:3px;border-left:2px solid var(--border)}
.meta-week-item.done{border-left-color:var(--green);opacity:.7}
.meta-week-item.cur{border-left-color:var(--acc)}
.meta-week-check{width:16px;height:16px;flex-shrink:0;accent-color:var(--acc);margin-top:1px;cursor:pointer}
.meta-week-body{flex:1}
.meta-week-num{font-size:9px;font-weight:700;font-family:'Oswald',sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--txt2);margin-bottom:2px}
.meta-week-task{font-size:11px;color:var(--txt);line-height:1.4}
.meta-week-task-inp{background:var(--bg);border:1px solid var(--border);color:var(--txt);border-radius:2px;padding:4px 6px;font-size:11px;font-family:'Inter',sans-serif;outline:none;width:100%;margin-top:4px}
.meta-week-task-inp:focus{border-color:var(--acc)}
.meta-complete-btn{background:none;border:1px solid var(--green);color:var(--green);border-radius:2px;padding:8px 0;font-size:11px;font-family:'Oswald',sans-serif;font-weight:700;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;width:100%;margin-top:4px;transition:background .2s}
.meta-complete-btn:hover{background:rgba(34,197,94,.1)}
.meta-hist-item{display:flex;align-items:center;gap:6px;font-size:10px;color:var(--txt2);padding:4px 0;border-bottom:1px solid var(--border)}
.meta-hist-item:last-child{border-bottom:none}
.meta-nivel-badge{font-size:9px;padding:2px 5px;border-radius:2px;font-family:'Oswald',sans-serif;font-weight:700;letter-spacing:.04em;background:var(--surf);color:var(--txt2)}
/* META DAILY */
.meta-day-row{display:flex;gap:4px;margin-bottom:6px}
.meta-day-pill{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 2px;border-radius:3px;border:1px solid var(--border);background:var(--surf);font-size:9px;font-family:'Oswald',sans-serif;font-weight:700;letter-spacing:.04em;color:var(--txt3)}
.meta-day-pill.today{border-color:var(--acc);color:var(--acc);background:var(--acc-d)}
.meta-day-pill.done{border-color:var(--green);color:var(--green);background:rgba(34,197,94,.08)}
.meta-day-check{font-size:11px;line-height:1}
.meta-today-card{background:var(--surf);border:1px solid var(--border2);border-left:2px solid var(--acc);border-radius:3px;padding:10px 12px;margin-bottom:10px}
.meta-today-label{font-size:9px;font-weight:700;font-family:'Oswald',sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--acc);margin-bottom:4px}
.meta-today-task{font-size:12px;color:var(--txt);line-height:1.5;margin-bottom:8px}
.meta-checkin-btn{background:var(--acc);color:#fff;border:none;border-radius:2px;padding:9px 0;font-size:11px;font-family:'Oswald',sans-serif;font-weight:700;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;width:100%;transition:opacity .2s}
.meta-checkin-btn:disabled{background:var(--green);cursor:default;opacity:.85}
.meta-notif-btn{background:none;border:1px solid var(--border2);color:var(--txt2);border-radius:2px;padding:7px 10px;font-size:10px;font-family:'Oswald',sans-serif;font-weight:600;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;width:100%;margin-top:4px}
.meta-notif-btn.on{border-color:var(--green);color:var(--green)}
.meta-dias-btn.sel{border-color:var(--acc)!important;color:var(--txt)!important;background:var(--acc-d)!important}
</style>
</head>
<body>

<div id="login">
  <div class="login-card">
    <div class="login-logo">INAMOVIBLE <span>APP</span></div>
    <div class="login-sub">Portal del estudiante</div>
    <!-- LOGIN FORM -->
    <div id="login-form">
      <label class="fl">Usuario</label>
      <input class="fi" id="inp-user" placeholder="tu usuario" autocomplete="username" autocorrect="off" autocapitalize="off" spellcheck="false">
      <label class="fl">Contraseña</label>
      <input class="fi" id="inp-pass" type="password" placeholder="••••••••" autocomplete="current-password" style="margin-bottom:4px">
      <button class="login-btn" id="login-btn" onclick="doLogin()">Entrar</button>
      <div class="login-err" id="login-err"></div>
      <div class="login-toggle">¿No tienes cuenta? <a onclick="showRegForm()">Regístrate</a></div>
    </div>
    <!-- REGISTRO FORM -->
    <div id="reg-form" class="reg-card">
      <label class="fl">Nombre completo</label>
      <input class="fi" id="reg-name" placeholder="Tu nombre" autocorrect="off" autocapitalize="words">
      <label class="fl">Fecha de nacimiento</label>
      <input class="fi" id="reg-dob" type="date" style="color-scheme:dark">
      <label class="fl">Sexo</label>
      <select class="fi" id="reg-sex" style="cursor:pointer">
        <option value="">Selecciona</option>
        <option value="M">Hombre</option>
        <option value="F">Mujer</option>
      </select>
      <label class="fl" style="color:var(--txt3)">Celular <span style="font-weight:400;text-transform:none;letter-spacing:0">(opcional)</span></label>
      <input class="fi" id="reg-phone" type="tel" placeholder="+57 300 000 0000" autocomplete="off">
      <label class="fl">Usuario</label>
      <input class="fi" id="reg-user" placeholder="elige un usuario" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">

async function sha256(msg){
  var buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(msg));
  return Array.from(new Uint8Array(buf)).map(function(b){return b.toString(16).padStart(2,'0');}).join('');
}
async function fetchSbKey(key){
  var r=await fetch(SB_URL+"/rest/v1/app_data?key=eq."+encodeURIComponent(LSK+key)+"&select=value",{headers:SB_H});
  var d=await r.json();
  return(Array.isArray(d)&&d.length)?d[0].value:null;
}
async function sbWrite(key,value){
  try{
    await fetch(SB_URL+"/rest/v1/app_data",{
      method:"POST",
      headers:Object.assign({},SB_H,{"Prefer":"resolution=merge-duplicates"}),
      body:JSON.stringify({key:LSK+key,value:value,updated_at:new Date().toISOString()})
    });
  }catch(e){}
}
function fmtTime(s){var m=Math.floor((s||0)/60),sec=(s||0)%60;return m+":"+(sec<10?"0":"")+sec;}
function esc(s){return(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function showErr(msg){var e=document.getElementById("login-err");if(e)e.textContent=msg;}
function showRegErr(msg){var e=document.getElementById("reg-err");if(e)e.textContent=msg;}
function setLoading(on){var b=document.getElementById("login-btn");if(b){b.disabled=on;b.innerHTML=on?'<span class="spin"></span> Entrando...':'Entrar';}}
function setRegLoading(on){var b=document.getElementById("reg-btn");if(b){b.disabled=on;b.innerHTML=on?'<span class="spin"></span> Creando...':'Crear cuenta';}}
function showRegForm(){document.getElementById("login-form").style.display="none";document.getElementById("reg-form").style.display="block";}
function showLoginForm(){document.getElementById("reg-form").style.display="none";document.getElementById("login-form").style.display="block";}

async function doLogin(){
  var uname=(document.getElementById("inp-user").value||"").trim().toLowerCase();
  var pass=document.getElementById("inp-pass").value||"";
  showErr("");
  if(!uname||!pass){showErr("Completa usuario y contraseña");return;}
  setLoading(true);
  try{
    var portales=await fetchSbKey("portales");
    if(!Array.isArray(portales)){showErr("Error de conexión");setLoading(false);return;}
    var hash=await sha256(pass);
    var entry=portales.find(function(p){return p.username===uname&&p.pwdHash===hash;});
    if(!entry){showErr("Usuario o contraseña incorrectos");setLoading(false);return;}
    saveSession(entry.studentId);
    await loadDashboard(entry.studentId);
  }catch(e){showErr("Error de conexión");}
  setLoading(false);
}

async function doRegister(){
  var name=(document.getElementById("reg-name").value||"").trim();
  var dob=(document.getElementById("reg-dob").value||"").trim();
  var sex=(document.getElementById("reg-sex").value||"").trim();
  var phone=(document.getElementById("reg-phone").value||"").trim();
  var uname=(document.getElementById("reg-user").value||"").trim().toLowerCase();
  var pass=document.getElementById("reg-pass").value||"";
  var code=(document.getElementById("reg-code").value||"").trim();
  showRegErr("");
  if(!name){showRegErr("Escribe tu nombre");return;}
  if(!sex){showRegErr("Selecciona tu sexo");return;}
  if(!uname||uname.length<3){showRegErr("Usuario debe tener al menos 3 caracteres");return;}
  if(pass.length<6){showRegErr("Contraseña debe tener al menos 6 caracteres");return;}
  setRegLoading(true);
  try{
    var portales=await fetchSbKey("portales")||[];
    if(portales.find(function(p){return p.username===uname;})){showRegErr("Ese usuario ya existe");setRegLoading(false);return;}
    var hash=await sha256(pass);
    var sid="u_"+uname+"_"+Date.now().toString(36);
    portales.push({username:uname,pwdHash:hash,studentId:sid});
    var users=await fetchSbKey("portal-users")||[];
    var newUser={id:sid,name:name,sex:sex,selfRegistered:true};
    if(dob)newUser.dob=dob;
    if(phone)newUser.phone=phone;
    if(code){
      var coachCode=await fetchSbKey("portal-coach-code")||"";
      if(code===coachCode){
        newUser.coach_linked=true;
        var coachStudents=await fetchSbKey("students")||[];
        // Try to link to existing coach profile by name (case-insensitive)
        var nameLow=name.toLowerCase().trim();
        var existingCoach=coachStudents.find(function(s){return (s.name||"").toLowerCase().trim()===nameLow;});
        if(existingCoach){
          // Link portal account to coach-managed profile
          newUser.coachStudentId=existingCoach.id;
          existingCoach.portalSid=sid;
          existingCoach.appUser=true;
          await sbWrite("students",coachStudents);
        } else {
          // New student not yet in coach list — add them
          if(!coachStudents.some(function(s){return s.id===sid;})){
            coachStudents.push({id:sid,name:name,appUser:true,selfRegistered:true,payStatus:"Pendiente",months:0,progress:0,fee:0});
            await sbWrite("students",coachStudents);
          }
        }
      }
    }
    users.push(newUser);
    await sbWrite("portales",portales);
    await sbWrite("portal-users",users);
    saveSession(sid);
    await loadDashboard(sid);
    showWelcomeModal();
  }catch(e){showRegErr("Error de conexión");}
  setRegLoading(false);
}

function doLogout(){
  try{localStorage.removeItem("portal_auth");}catch(e){}

  document.getElementById("login").style.display="flex";
  document.getElementById("app").style.display="none";
  document.getElementById("inp-pass").value="";
  showErr("");
}

  document.getElementById("app-body").innerHTML='<div class="loading-wrap"><div class="spin"></div>Cargando...</div>';
  try{
    var res=await Promise.all([
      fetchSbKey("students"),
      fetchSbKey("rm-"+sid),
      fetchSbKey("plan-"+sid),
      fetchSbKey("evals-"+sid),
      fetchSbKey("att-"+sid),
      fetchSbKey("nutrition-"+sid),
      fetchSbKey("portal-cal-"+sid),
      fetchSbKey("portal-meals-"+sid),
      fetchSbKey("portal-steps-"+sid),
      fetchSbKey("portal-nutri-ok-"+sid),
      fetchSbKey("portal-quotes-"+sid),
      fetchSbKey("portal-notes-"+sid),
      fetchSbKey("portal-badges-"+sid),
      fetchSbKey("portal-ranking"),
      fetchSbKey("portal-book-"+sid),
      fetchSbKey("portal-diario-"+sid),
      fetchSbKey("portal-obstaculo-"+sid),
      fetchSbKey("portal-fotos-"+sid),
      fetchSbKey("portal-meta-"+sid)
    ]);
    var students=res[0]||[],rms=res[1]||{};
    G.plan=res[2];G.evals=res[3]||[];G.att=res[4]||[];
    G.nutrition=res[5]||{};G.calData=res[6]||{};
    G.mealCount=res[7]||5;
    G.stepsGoal=res[8]||8000;
    G.nutriOk=res[9]===true;
    G.shownQuotes=res[10]||[];
    G.notes=res[11]||[];
    G.badges=res[12]||{};
    G.ranking=res[13]||[];
    G.book=res[14]||null;
    G.diario=res[15]||[];
    G.obstaculo=res[16]||[];
    G.fotos=res[17]||[];
    G.meta=res[18]||null;
    // Try by direct sid, or by portalSid reference
    G.st=students.find(function(s){return s.id===sid||s.portalSid===sid;})||{};
    // If still no name, check portal-users for coachStudentId link or own data
    if(!G.st.name){
      var pUsers=await fetchSbKey("portal-users")||[];
      var puRecord=pUsers.find(function(u){return u.id===sid;});
      if(puRecord&&puRecord.coachStudentId){
        // Linked account: load full coach-managed profile
        var linked=students.find(function(s){return s.id===puRecord.coachStudentId;});
        if(linked)G.st=linked;
      }
      if(!G.st.name&&puRecord){
        Object.assign(G.st,{name:puRecord.name,sex:puRecord.sex,dob:puRecord.dob,phone:puRecord.phone,objective:puRecord.objective,selfRegistered:true});
      }
    }
    document.getElementById("app-stname").textContent=G.st.name||"Estudiante";
    document.getElementById("app-stobj").textContent=G.st.objective||"";
    // Fix stale ranking entry: if stored name equals sid, update it now
    if(G.st.name){
      var myRank=G.ranking.find(function(r){return r.sid===sid;});
      if(myRank&&myRank.name===sid){myRank.name=G.st.name;sbWrite("portal-ranking",G.ranking).catch(function(){});}
    }
    renderDashboard(rms);
    requestNotifPermission();
    setTimeout(function(){checkNotifs(G.st,G.evals&&G.evals[0],G.calData).catch(function(){});},800);
    setTimeout(function(){setupMetaNotifications().catch(function(){});},1200);
  }catch(e){
    document.getElementById("app-body").innerHTML='<div class="loading-wrap">Error cargando datos. Recarga la página.</div>';
  }
}

function parseHeight(raw){var h=parseFloat(raw)||0;return h>3?h:h>0?Math.round(h*100):0;}
function calcMacros(){
  var st=G.st,ev=G.evals&&G.evals.length?G.evals[0]:null;
  var wkg=parseFloat((ev&&ev.weight)||st.weight)||70;
  var hcm=parseHeight(st.height)||170;
  var age=parseInt(st.age)||25,sex=st.sex||"M";
  var act=parseFloat((G.nutrition&&G.nutrition.activity)||"1.55");
  var goal=(G.nutrition&&G.nutrition.goal)||"mant";
  var tmb=sex==="M"?(10*wkg)+(6.25*hcm)-(5*age)+5:(10*wkg)+(6.25*hcm)-(5*age)-161;
  tmb=Math.round(tmb);
  var tdee=Math.round(tmb*act);
  var kcal=goal==="deficit"?tdee-300:goal==="superavit"?tdee+300:tdee;
  var pPct=sex==="M"?30:28,cPct=goal==="superavit"?45:goal==="deficit"?35:40,fPct=100-pPct-cPct;
  return{tmb:tmb,tdee:tdee,kcal:kcal,pPct:pPct,cPct:cPct,fPct:fPct,
    protG:Math.round((kcal*pPct/100)/4),carbG:Math.round((kcal*cPct/100)/4),fatG:Math.round((kcal*fPct/100)/9),
    wkg:wkg,act:act,goal:goal,hcm:hcm,age:age,sex:sex};
}

function buildMealsHtml(){
  var macro=calcMacros(),mc=G.mealCount,dist=MEAL_DIST[mc]||MEAL_DIST[5],names=MEAL_NAMES[mc]||MEAL_NAMES[5];
  var e=todayEntry();if(!e.m||e.m.length!==mc)e.m=Array(mc).fill(0);
  var html='';
  dist.forEach(function(pct,i){
    var pk=Math.round(macro.protG*pct/100),ck=Math.round(macro.carbG*pct/100),fk=Math.round(macro.fatG*pct/100),kc=Math.round(macro.kcal*pct/100);
    var done=e.m[i]?1:0;
    html+='<div class="meal-row"><div class="meal-info"><div class="meal-name">'+esc(names[i])+'</div><div class="meal-detail">P:'+pk+'g · C:'+ck+'g · G:'+fk+'g</div></div>'+
    '<div style="display:flex;align-items:center;gap:8px"><span class="meal-kcal">'+kc+' kcal</span>'+
    '<button class="check-btn'+(done?" done":"")+'" id="mcheck-'+i+'" onclick="toggleMeal('+i+')">'+(done?"✓":"○")+'</button></div></div>';
  });
  return html;
}

function buildImcScale(imc,wkg,hcm){
  if(!imc)return'';
  // Bar flex: Bajo(18.5) Normal(6.5) Sobrepeso(5) Obesidad(10) = 40 total
  // Zone boundaries in %: 0 → 46.25 → 62.5 → 75 → 100
  var pct=0;
  if(imc<=18.5) pct=(imc/18.5)*46.25;
  else if(imc<=25) pct=46.25+((imc-18.5)/6.5)*16.25;
  else if(imc<=30) pct=62.5+((imc-25)/5)*12.5;
  else pct=Math.min(75+((imc-30)/15)*22,97);
  pct=Math.max(1,Math.min(97,pct));
  var cls=imc<18.5?"bw":imc<25?"bg":imc<30?"bw":"bd";
  var lbl=imc<18.5?"Bajo peso":imc<25?"Normal":imc<30?"Sobrepeso":"Obesidad";
  var nextZone=imc<18.5?"Normal":imc<25?"Sobrepeso":imc<30?"Obesidad I":null;
  var nextVal=imc<18.5?18.5:imc<25?25:imc<30?30:null;
  var distLine=nextVal!=null?'<div style="font-size:10px;color:var(--txt2);margin-top:6px">→ A <strong style="color:var(--txt)">'+(Math.round((nextVal-imc)*10)/10)+' pts</strong> de '+nextZone+'</div>':'';
  var withLine=(wkg&&hcm)?'<div style="font-size:10px;color:var(--txt2);margin-top:3px">Con '+wkg+'kg y '+hcm+'cm → IMC '+imc+'. Peso en rango <strong style="color:var(--txt)">'+lbl.toLowerCase()+'</strong> para esta altura.</div>':'';
  return'<div style="margin:0 0 6px">'+
    '<div style="position:relative;padding-bottom:20px;margin-bottom:2px">'+
      '<div style="display:flex;height:8px;border-radius:99px;overflow:hidden">'+
        '<div style="flex:18.5;background:#FBBF24;opacity:.45"></div>'+
        '<div style="flex:6.5;background:#34D399"></div>'+
        '<div style="flex:5;background:#FBBF24;opacity:.7"></div>'+
        '<div style="flex:10;background:#F87171"></div>'+
      '</div>'+
      '<div style="position:absolute;left:'+pct+'%;top:0;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;pointer-events:none">'+
        '<div style="width:2px;height:8px;background:#fff;border-radius:1px"></div>'+
        '<div style="font-size:8px;color:#fff;font-weight:700;white-space:nowrap;background:rgba(0,0,0,.6);padding:1px 4px;border-radius:3px;margin-top:2px">Tú</div>'+
      '</div>'+
      '<div style="display:flex;justify-content:space-between;font-size:9px;color:var(--txt3);position:absolute;bottom:0;left:0;right:0">'+
        '<span>Bajo<br/>&lt;18.5</span><span style="text-align:center">Normal<br/>18.5–25</span><span style="text-align:center">Sobrepeso<br/>25–30</span><span style="text-align:right">Obesidad<br/>&gt;30</span>'+
      '</div>'+
    '</div>'+
    distLine+withLine+
  '</div>';
}

function buildDots(dateStr){
  var e=G.calData[dateStr]||{},mc=G.mealCount;
  var mDone=(e.m||[]).filter(function(x){return x;}).length===mc&&mc>0;
  var mAny=(e.m||[]).some(function(x){return x;});
  var hasNote=!!(e.note&&e.note.trim());
  return'<div class="cal-dots">'+
    '<div class="cal-dot '+(e.w?"dot-w":"dot-empty")+'" title="Entrenamiento"></div>'+
    '<div class="cal-dot '+(e.s?"dot-s":"dot-empty")+'" title="Pasos"></div>'+
    '<div class="cal-dot '+(mDone?"dot-m":mAny?"dot-m":"dot-empty")+'" style="'+(mAny&&!mDone?"opacity:.45":"")+'" title="Comidas"></div>'+
    (hasNote?'<div class="cal-note-dot '+(e.noteType==="pendiente"?"dot-note-pend":"dot-note-ap")+'" title="'+esc(e.note)+'"></div>':'')+
  '</div>';
}
function buildCalendar(){
  var ym=G.calMonth,parts=ym.split("-"),yr=parseInt(parts[0]),mo=parseInt(parts[1])-1;
  var monthNames=["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
  var first=new Date(yr,mo,1),last=new Date(yr,mo+1,0),startDow=(first.getDay()+6)%7;
  var tp=G.today.split("-"),todayY=parseInt(tp[0]),todayM=parseInt(tp[1])-1,todayD=parseInt(tp[2]);
  var html='<div class="cal-header"><button class="cal-nav" onclick="calNav(-1)">‹</button><div class="cal-month">'+monthNames[mo]+' '+yr+'</div><button class="cal-nav" onclick="calNav(1)">›</button></div>';
  html+='<div class="cal-grid">';
  ["Lu","Ma","Mi","Ju","Vi","Sa","Do"].forEach(function(d){html+='<div class="cal-dow">'+d+'</div>';});
  for(var i=0;i<startDow;i++)html+='<div class="cal-day empty"></div>';
  for(var d=1;d<=last.getDate();d++){
    var dStr=yr+"-"+(mo+1<10?"0":"")+(mo+1)+"-"+(d<10?"0":"")+d;
    var isToday=(yr===todayY&&mo===todayM&&d===todayD);
    var isFuture=new Date(yr,mo,d)>new Date(todayY,todayM,todayD);
    html+='<div class="cal-day'+(isToday?" today":"")+(isFuture?" future":"")+'" id="calday-'+dStr+'" onclick="openDayNoteModal(\''+dStr+'\')" style="cursor:pointer">'+
      '<div class="cal-dn">'+d+'</div>'+
      '<div id="caldots-'+dStr+'">'+(!isFuture?buildDots(dStr):"")+'</div></div>';
  }
  html+='</div><div style="margin-top:10px;display:flex;gap:12px;font-size:10px;color:var(--txt2)">'+
    '<span><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--acc);margin-right:4px;vertical-align:middle"></span>Entreno</span>'+
    '<span><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--warn);margin-right:4px;vertical-align:middle"></span>Pasos</span>'+
    '<span><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);margin-right:4px;vertical-align:middle"></span>Comidas</span></div>';
  return html;
}
function calNav(dir){
  var parts=G.calMonth.split("-"),yr=parseInt(parts[0]),mo=parseInt(parts[1])-1;
  mo+=dir;if(mo<0){mo=11;yr--;}if(mo>11){mo=0;yr++;}
  G.calMonth=yr+"-"+(mo+1<10?"0":"")+(mo+1);
  var el=document.getElementById("calendar-inner");if(el)el.innerHTML=buildCalendar();
}

    '<div class="hoy-sum-item'+(te0.s?" done":"")+'"><div class="hoy-sum-ico">'+(te0.s?"✓":"○")+'</div><div class="hoy-sum-lbl">Pasos</div></div>'+

  /* ── ONBOARDING (mostrar si faltan pasos) ── */

    '</div>';

  /* ── PERFIL ── */
  var profTags="";

  if(st.dob){var dobAge=Math.floor((Date.now()-new Date(st.dob))/(365.25*24*3600*1000));if(dobAge>0&&dobAge<100)profTags+='<span class="prof-tag">'+dobAge+' años</span>';}

  if(st.phone)profTags+='<span class="prof-tag">'+esc(st.phone)+'</span>';
  var ev0=G.evals&&G.evals.length?G.evals[0]:null;

    '<div><div class="prof-name" id="prof-name-disp">'+esc(st.name||"Estudiante")+'</div>'+
    (st.objective?'<div class="prof-obj" id="prof-obj-disp">'+esc(st.objective)+'</div>':'<div class="prof-obj" id="prof-obj-disp" style="display:none"></div>')+

    (profTags?'<div class="prof-meta">'+profTags+'</div>':'')+

  if(masaMagra!=null){

  var MEDIDAS=[["Cintura",ev&&ev.cin,"&lt;94 cm (H) / &lt;80 cm (M)"],["Cadera",ev&&ev.cad,"Referencia para ICC"],["Pecho",ev&&ev.pecho,""],["Bícep",ev&&ev.bicep,""],["Muslo",ev&&ev.muslo,""],["Glúteo",ev&&ev.glut,""],["Pantorrilla",ev&&ev.pant,""]].filter(function(m){return m[1]!=null&&m[1]!="";});

      '<span class="today-block-icon">'+(te.s?I.done_b:I.steps_b)+'</span>'+

        '<div class="today-block-name">Pasos</div>'+

        '<div class="step-bar-wrap"><div class="step-bar-fill" style="width:'+stepPct+'%"></div></div>'+
        '<div class="step-goal-row" id="step-edit-row" style="display:none">'+
          '<input class="step-goal-inp" id="step-goal-inp" type="number" min="1000" max="50000" step="500" placeholder="Pasos meta">'+
          '<button class="step-save-btn" onclick="saveStepGoal()">Guardar</button>'+
        '</div>'+
        '<button class="edit-link" onclick="showStepEdit()">'+I.pencil+' Cambiar meta</button>'+
      '</div>'+
      '<button class="check-btn'+(te.s?" done":"")+'" onclick="toggleSteps()" style="margin-top:2px">'+(te.s?"✓":"○")+'</button>'+
    '</div>'+
    (function(){
      var ym=G.today.slice(0,7);
      var monthDays=Object.keys(G.calData).filter(function(d){return d.startsWith(ym)&&d<=G.today;});

    '</div></div>';

  /* INGESTA */
  if(hasEval)rightHtml+='<div class="card"><div class="ct">'+I.food_s+' INGESTA</div><div id="nutri-content">'+buildNutriHtml()+'</div></div>';

  '</div>';

  }
  if(st.months)memHtml+='<div class="mem-row"><span class="mem-key">Meses entrenando</span><span class="mem-val">'+st.months+'</span></div>';
  rightHtml+='<div class="card"><div class="ct">'+I.card_s+' ACCESO</div>'+memHtml+'</div>';

  leftHtml+='<div class="card"><div class="ct">'+metaIcon+'MI SIGUIENTE PASO</div><div id="meta-inner">'+buildMetaHtml()+'</div></div>';

async function getNextQuote(){
  var shown=G.shownQuotes||[];
  var all=QUOTES.map(function(_,i){return i;}).filter(function(i){return shown.indexOf(i)<0;});
  if(all.length===0){shown=[];all=QUOTES.map(function(_,i){return i;});}
  var idx=all[Math.floor(Math.random()*all.length)];
  shown.push(idx);
  G.shownQuotes=shown;
  await sbWrite("portal-quotes-"+G.sid,shown);
  return QUOTES[idx];
}

function computeProgress(calData,book,diarioCount){
  var entrenos=0,pasos=0,comidas=0;
  Object.values(calData||{}).forEach(function(e){
    if(e.w)entrenos++;
    if(e.s)pasos++;
    if(e.m)comidas+=e.m.filter(function(x){return x;}).length;
  });
  var consecutive=0;
  var today=new Date();
  for(var d=0;d<500;d++){
    var dd=new Date(today);dd.setDate(dd.getDate()-d);
    var dk=dd.toISOString().slice(0,10);
    var dow2=dd.getDay();
    var entry=(calData||{})[dk];
    if(entry&&(entry.w||entry.s))consecutive++;
    else if(dow2===0||dow2===6){/* fin de semana opcional */}
    else break;
  }
  var libros=0;
  if(book){
    libros=(book.history||[]).length;
    if(book.current)libros++;
  }
  return{entrenos:entrenos,pasos:pasos,comidas:comidas,racha:consecutive,libros:libros,diario:diarioCount||0};
}

function buildProgresoHtml(progress,badges){
  var CATS=[
    {key:"entrenos",label:"ENTRENOS",count:progress.entrenos,
     milestones:[1,5,10,25,50,100,200,365,500,1000],
     labels:["primer entreno","5 entrenamientos","10 entrenamientos","25 entrenamientos","50 entrenamientos","100 entrenamientos","200 entrenamientos","365 entrenamientos","500 entrenamientos","1000 entrenamientos"]},
    {key:"pasos",label:"PASOS",count:progress.pasos,
     milestones:[1,5,10,20,40,60,100,150,200,365],
     labels:["primer dia de pasos","5 dias","10 dias","20 dias","40 dias","60 dias","100 dias","150 dias","200 dias","365 dias"]},
    {key:"comidas",label:"COMIDAS",count:progress.comidas,
     milestones:[1,10,50,100,250,500,1000],
     labels:["primera comida","10 comidas","50 comidas","100 comidas","250 comidas","500 comidas","1000 comidas"]},
    {key:"racha",label:"RACHA",count:progress.racha,
     milestones:[3,7,14,21,30,60,90,180,365],
     labels:["3 dias","7 dias","14 dias","21 dias","30 dias","60 dias","90 dias","180 dias","365 dias"]},
    {key:"libros",label:"LECTURA",count:progress.libros,
     milestones:[1,3,5,10,20],
     labels:["primer libro","3 libros","5 libros","10 libros","20 libros"]},
    {key:"diario",label:"REFLEXION",count:progress.diario,
     milestones:[1,7,14,30,60,100],
     labels:["primera reflexion","7 reflexiones","14 reflexiones","30 reflexiones","60 reflexiones","100 reflexiones"]}
  ];
  var html='<div class="progreso-grid">';
  CATS.forEach(function(cat){
    var count=cat.count||0;
    var nextMilestone=null,nextLabel="",earnedAll=false;
    for(var i=0;i<cat.milestones.length;i++){
      if(count<cat.milestones[i]){nextMilestone=cat.milestones[i];nextLabel=cat.labels[i];break;}
    }
    if(nextMilestone===null){earnedAll=true;nextMilestone=cat.milestones[cat.milestones.length-1];nextLabel=cat.labels[cat.labels.length-1];}
    var pct=earnedAll?100:Math.min(100,Math.round((count/nextMilestone)*100));
    var lastEarned="";
    for(var j=cat.milestones.length-1;j>=0;j--){
      if(count>=cat.milestones[j]){var bk=cat.key+"_"+cat.milestones[j];if(badges[bk])lastEarned=new Date(badges[bk]).toLocaleDateString("es-CO",{day:"numeric",month:"short"});break;}
    }
    html+='<div class="progreso-card'+(earnedAll?" progreso-card-done":"")+'">'+
      '<div class="progreso-card-label">'+cat.label+'</div>'+
      '<div class="progreso-card-top">'+
        '<div class="progreso-card-count">'+count+'</div>'+
        '<div class="progreso-card-pct'+(earnedAll?" progreso-card-pct-done":"")+'">'+pct+'%</div>'+
      '</div>'+
      '<div class="progreso-card-meta">'+(earnedAll?'completado':'meta: '+nextMilestone+' &mdash; '+nextLabel)+'</div>'+
      '<div class="progreso-bar"><div class="progreso-bar-fill" style="width:'+pct+'%"></div></div>'+
      (lastEarned?'<div class="progreso-card-date">ultimo logro: '+lastEarned+'</div>':'')+
    '</div>';
  });
  html+='</div>';
  return html;
}

function computeProgressBadgeKeys(calData,book,diarioCount){
  var p=computeProgress(calData,book,diarioCount);
  var CATS=[
    {key:"entrenos",count:p.entrenos,milestones:[1,5,10,25,50,100,200,365,500,1000]},
    {key:"pasos",count:p.pasos,milestones:[1,5,10,20,40,60,100,150,200,365]},
    {key:"comidas",count:p.comidas,milestones:[1,10,50,100,250,500,1000]},
    {key:"racha",count:p.racha,milestones:[3,7,14,21,30,60,90,180,365]},
    {key:"libros",count:p.libros,milestones:[1,3,5,10,20]},
    {key:"diario",count:p.diario,milestones:[1,7,14,30,60,100]}
  ];
  var earned={};
  CATS.forEach(function(cat){
    cat.milestones.forEach(function(m){
      if(cat.count>=m)earned[cat.key+"_"+m]=1;
    });
  });
  return earned;
}

async function checkAndSaveBadges(){
  var newEarned=computeProgressBadgeKeys(G.calData,G.book,G.diario.length);
  var prev=G.badges||{};
  var changed=false;
  var today=G.today;
  Object.keys(newEarned).forEach(function(k){
    if(!prev[k]){prev[k]=today;changed=true;}
  });
  if(changed){G.badges=prev;await sbWrite("portal-badges-"+G.sid,prev);}
}

async function updateRanking(){
  var days=Object.values(G.calData||{});
  var workouts=days.filter(function(d){return d.w;}).length;
  var steps=days.filter(function(d){return d.s;}).length;
  var me={sid:G.sid,name:G.st.name||G.sid,workouts:workouts,steps:steps,updated:G.today};
  var list=(G.ranking||[]).filter(function(r){return r.sid!==G.sid;});
  list.push(me);
  list.sort(function(a,b){return(b.workouts+b.steps)-(a.workouts+a.steps);});
  G.ranking=list;
  await sbWrite("portal-ranking",list);
  var el=document.getElementById("ranking-inner");if(el)el.innerHTML=buildRankingHtml();
}

// Consecutive streak for the current step, going backwards from today
// Only counts within this step's window (after previous step completed)
function getStepStreak(act,stepIdx){
  var checkins=act.checkins||{};
  var stepStartStr;
  if(stepIdx===0){
    stepStartStr=act.created;
  }else{
    var prev=act.weeks[stepIdx-1];
    if(!prev||!prev.completedDate)return 0;
    var sd=new Date(prev.completedDate);sd.setDate(sd.getDate()+1);
    stepStartStr=sd.toISOString().slice(0,10);
  }
  var stepStart=new Date(stepStartStr);
  var d=new Date(G.today);
  var streak=0;
  while(d>=stepStart){
    var dStr=d.toISOString().slice(0,10);
    if(checkins[dStr]){streak++;d.setDate(d.getDate()-1);}
    else break;
  }
  return streak;
}

// Did the streak break? (had at least one prior check-in but yesterday is empty)
function isStreakBroken(act,stepIdx){
  var checkins=act.checkins||{};
  var stepStartStr=stepIdx===0?act.created:(function(){
    var prev=act.weeks[stepIdx-1];
    if(!prev||!prev.completedDate)return act.created;
    var sd=new Date(prev.completedDate);sd.setDate(sd.getDate()+1);
    return sd.toISOString().slice(0,10);
  })();
  var yd=new Date(G.today);yd.setDate(yd.getDate()-1);
  var ydStr=yd.toISOString().slice(0,10);
  if(ydStr<stepStartStr)return false; // step just started today
  if(checkins[ydStr])return false; // yesterday was checked
  // check if there's any prior check-in in this step
  return Object.keys(checkins).some(function(k){return checkins[k]&&k>=stepStartStr&&k<G.today;});
}

async function checkInToday(){
  if(!G.meta||!G.meta.active)return;
  if(!G.meta.active.checkins)G.meta.active.checkins={};
  if(G.meta.active.checkins[G.today])return;
  G.meta.active.checkins[G.today]=true;
  var act=G.meta.active;
  var req=act.diasPorSemana||3;
  var curStepIdx=act.weeks.findIndex(function(w){return!w.done;});
  var stepUnlocked=false;
  if(curStepIdx>=0){
    var streak=getStepStreak(act,curStepIdx);
    if(streak>=req){
      act.weeks[curStepIdx].done=true;
      act.weeks[curStepIdx].completedDate=G.today;
      stepUnlocked=true;
    }
  }
  await sbWrite("portal-meta-"+G.sid,G.meta);
  var el=document.getElementById("meta-inner");if(el)el.innerHTML=buildMetaHtml();
  if(stepUnlocked){
    showToast("PASO COMPLETADO",req+" días seguidos. Nadie te los puede quitar.","ok");
  }else{
    var st=curStepIdx>=0?getStepStreak(act,curStepIdx):0;
    var falta=req-st;
    showToast("Registrado","Racha: "+st+" / "+req+" días seguidos. Faltan "+falta+".","acc");
  }
}

function _metaStepLabel(act,i){

  if(dur.u==="días"){var chunk=Math.ceil(dur.v/n),s=i*chunk+1,e=Math.min((i+1)*chunk,dur.v);return s===e?"Día "+s:"Días "+s+"–"+e;}
  if(dur.u==="meses"){var mc=Math.ceil(dur.v/n),ms=i*mc+1,me2=Math.min((i+1)*mc,dur.v);return ms===me2?"Mes "+ms:"Meses "+ms+"–"+me2;}
  if(dur.v<=4)return"Semana "+(i+1);
  var wc=Math.ceil(dur.v/n),ws=i*wc+1,we=Math.min((i+1)*wc,dur.v);
  return ws===we?"Semana "+ws:"Semanas "+ws+"–"+we;
}
